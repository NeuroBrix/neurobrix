name: Bug Report
description: Report a bug in NeuroBrix
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the information below to help us investigate.

  - type: input
    id: version
    attributes:
      label: NeuroBrix Version
      description: "Run `neurobrix --version` and paste the output"
      placeholder: "e.g., NeuroBrix v0.5.4"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: "GPU model(s) and count, or CPU only; the --hardware profile if you passed one"
      placeholder: "e.g., 2x NVIDIA V100 32GB, or CPU only"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model Name
      description: "The hub identifier of the model you were running"
      placeholder: "e.g., TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    validations:
      required: true

  - type: dropdown
    id: family
    attributes:
      label: Model Family
      options:
        - Language model (LLM / code)
        - Vision-language or multimodal
        - Speech-to-text or speech understanding
        - Text-to-speech
        - Image generation
        - Video generation
        - Upscaler
        - Other
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Command Used
      options:
        - neurobrix run
        - neurobrix serve
        - neurobrix chat
        - neurobrix import
        - neurobrix hub
        - neurobrix validate
        - neurobrix inspect
        - neurobrix upscale
        - neurobrix doctor
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: "A clear description of what happened"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "Step-by-step instructions to reproduce the issue"
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What you expected to happen"
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Error Traceback
      description: "Full error output (paste between the backticks)"
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Output of `neurobrix doctor` and `neurobrix info --system`, and the execution mode flag used (--compiled, --triton, ...)"
      render: shell
