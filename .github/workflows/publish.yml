name: Publish to PyPI

# Only a published GitHub release of a release tag publishes (no manual run). The files uploaded are the release's own
# files, the ones the release gate trialled: they are checked against the manifest committed at the tag
# (release/<tag>.sha256) and nothing is uploaded on any difference. Nothing is built here.
# Every action is pinned by its full commit sha (the version in the comment).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish the tested files
    if: startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'nbxtensor-v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Download the release's files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
      - name: The files are the tested files
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 tools/release_files_check.py --manifest "release/$TAG.sha256" --dist dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
