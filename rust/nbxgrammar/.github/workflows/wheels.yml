# nbxgrammar's wheels: one per platform (the library is a C ABI loaded with ctypes, so a py3-none-<platform> wheel
# serves every Python 3; one CPython build per platform is enough). Built by cibuildwheel with the crate's pinned
# toolchain, repaired (auditwheel / delocate), then tested: the crate's oracle tests and the installed wheel's smoke test.
# Publication is a separate, manual step of the project's owner — this workflow uploads artifacts only.
name: wheels
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: macos-14, arch: arm64, deployment: "11.0" }
          - { os: macos-13, arch: x86_64, deployment: "10.12" }
          - { os: windows-2022, arch: AMD64 }
    steps:
      - uses: actions/checkout@v4
      # one wheel for one tree: the zip's times are the commit's (the library's bytes are fixed by setup.py)
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
        shell: bash
      - uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_ENVIRONMENT_PASS_LINUX: "SOURCE_DATE_EPOCH"
          CIBW_BUILD: "cp311-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BEFORE_ALL_LINUX: "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment }}"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest -q {project}/tests_py"
      - name: The crate's oracle tests
        if: runner.os != 'Linux'
        run: cargo test --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
