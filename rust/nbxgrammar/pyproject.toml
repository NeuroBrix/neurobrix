[build-system]
requires = ["setuptools>=69", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "nbxgrammar"
version = "0.1.0"
description = "NeuroBrix's grammar engine for constrained decoding: JSON Schema and tool-call envelopes to per-step token masks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
authors = [{ name = "The NeuroBrix project", email = "contact@neurobrix.org" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://neurobrix.org"
Source = "https://github.com/NeuroBrix/nbxgrammar"
Documentation = "https://docs.neurobrix.org"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["nbxgrammar"]
