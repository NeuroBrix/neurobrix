# Hardware Profile: Dell C4140 — 4x V100 16GB NVLink Mesh
# 4x V100 16GB (Total 64GB) in full NVLink mesh

id: c4140-4xv100-16GB-nvlink
vendor: dell
preferred_dtype: float16
