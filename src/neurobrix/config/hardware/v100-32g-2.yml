# Hardware Profile: NVIDIA V100 32GB (GPU index 2)
# Single V100 with 32GB HBM2 memory at physical slot 2

id: v100-32g-2
vendor: nvidia
preferred_dtype: float16
summary:
  total_gpus: 1
  total_vram_gb: 32
  topology: Single-GPU
devices:
- index: 2
  brand: nvidia
  model: Tesla V100-SXM2-32GB
  memory_mb: 32510
  compute_capability: '7.0'
  supports_dtypes:
  - float32
  - float16
  architecture: volta
  pcie_version: '3.0'
interconnect:
  groups: []
pcie_fallback:
  version: '3.0'
  lanes: 16
  bandwidth_gbps: 32
notes: |
  NVIDIA V100 with 32GB HBM2 memory.
  No bfloat16 hardware support (Volta architecture).
  Uses physical GPU index 2 on multi-GPU system.

# The host these cards sit in: the same machine as c4140-4xv100-16GB-nvlink (its cpu facts, rule 1)
cpu:
  model: Intel(R) Xeon(R) Gold 6230 CPU @ 2.10GHz
  cores: 40
  threads: 80
  ram_mb: 257530
  architecture: x86_64
  features:
  - fma
  - sse4_1
  - sse4_2
  - avx
  - f16c
  - avx2
  - avx512f
  - avx512_vnni
  runtime_base_mb:
    compiled: 803
    triton: 207
  # the loaders' parallel reads, MEASURED on the rack (tools/measure_io_workers.py, the 29 Qwen3-30B shards on
  # the RDMA cache, 2026-10-30: 6149 / 6241 MiB/s at 16 in two steady runs)
  io_workers: 16
