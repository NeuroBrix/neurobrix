# Hardware Profile: NVIDIA V100 16GB
# Single V100 with 16GB HBM2 memory

id: v100-16g
vendor: nvidia
preferred_dtype: float16
host_measured:
  source: "measured 2026-10-24 22:38:27 CEST on the rack, alone, the host memory bandwidth 2026-10-25 after chain48 (tools/profile_facts.py; the shard read over the NFS/RDMA mount)"
  host_memory_gbps: 11
  host_matmul_gflops: 761
  storage_read_gbps: 0.93
summary:
  total_gpus: 1
  total_vram_gb: 16
  topology: Single-GPU
# CPU section enables the Doctrine R35 cascade — `_place_component`
# Strategy 4 (CPU placement for components that overflow the GPU)
# and `cpu_execution` (last-resort whole-model CPU) both consult the
# host RAM budget here.
cpu:
  model: generic-x86_64
  cores: 16
  threads: 32
  ram_mb: 131072
  architecture: x86_64
  features:
  - fma
  - sse4_1
  - sse4_2
  - avx
  - f16c
  - avx2
devices:
- index: 0
  brand: nvidia
  model: Tesla V100-SXM2-16GB
  memory_mb: 16160
  runtime_total_mb: 16151  # measured 2026-10-27 on the rack (cudaMemGetInfo, autodetect._runtime_card_facts)
  runtime_context_mb: 306  # measured 2026-10-27, the runtime's own context on the card
  compute_capability: '7.0'
  supports_dtypes:
  - float32
  - float16
  architecture: volta
  pcie_version: '3.0'
  measured:
    source: "measured 2026-10-24 22:38:01 CEST on card 0 of the rack, alone (tools/profile_facts.py)"
    matmul_tflops: {float16: 42.3, float32: 13.5}
    memory_gbps: 789
    h2d_gbps: 8.1
    d2h_gbps: 3.7
    h2d_pageable_gbps: 4.6
    # the engines' loaders, GB/s landed — measured 2026-10-27 21:57-21:59 CET on the rack, card 0, alone (tools/profile_facts.py --weights, loader-rates-tool 4ee138b0 on the loader of 93b01e1c): Qwen3-30B-A3B:model BF16, Wan2.2-I2V-A14B:transformer F32, Sana_1600M:transformer F16, 3 GB each, cold = pages evicted (posix_fadvise DONTNEED)
    weight_load_gbps:
      triton:
        BF16: {device: {cold: 0.95, warm: 1.39}, host: {cold: 0.42, warm: 0.53}}
        F32: {device: {cold: 0.87, warm: 0.93}, host: {cold: 0.57, warm: 0.71}}
        F16: {device: {cold: 1.14, warm: 1.81}, host: {cold: 0.73, warm: 0.99}}
      compiled:
        BF16: {device: {cold: 0.92, warm: 1.6}, host: {cold: 0.6, warm: 1.56}}
        F32: {device: {cold: 1.3, warm: 1.53}, host: {cold: 0.68, warm: 2.46}}
        F16: {device: {cold: 2.56, warm: 3.28}, host: {cold: 0.7, warm: 5.77}}
interconnect:
  groups: []
pcie_fallback:
  version: '3.0'
  lanes: 16
  bandwidth_gbps: 32
notes: |
  NVIDIA V100 with 16GB HBM2 memory.
  No bfloat16 hardware support (Volta architecture).
  Recommended for inference and small training jobs.
