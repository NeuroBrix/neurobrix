# Hardware Profile: 2x NVIDIA V100 32GB with NVLink
# Dual V100-32GB for tensor parallel inference

id: v100-32g-x2-nvlink
vendor: nvidia
preferred_dtype: float16
summary:
  total_gpus: 2
  total_vram_gb: 64
  topology: Multi-GPU
devices:
- index: 2
  brand: nvidia
  model: Tesla V100-SXM2-32GB
  memory_mb: 32510
  compute_capability: '7.0'
  supports_dtypes:
  - float32
  - float16
  architecture: volta
  pcie_version: '3.0'
- index: 3
  brand: nvidia
  model: Tesla V100-SXM2-32GB
  memory_mb: 32510
  compute_capability: '7.0'
  supports_dtypes:
  - float32
  - float16
  architecture: volta
  pcie_version: '3.0'
interconnect:
  groups:
  - index: 0
    members:
    - 2
    - 3
    type: nvlink_p2p
    tech: nvlink
    bandwidth_gbps: 300
pcie_fallback:
  version: '3.0'
  lanes: 16
  bandwidth_gbps: 32
notes: |
  Dual V100-32GB with NVLink for tensor parallel inference.
  Total 64GB VRAM. No bfloat16 hardware support (Volta architecture).

# The host these cards sit in: the same machine as c4140-4xv100-16GB-nvlink (its cpu facts, rule 1)
cpu:
  model: Intel(R) Xeon(R) Gold 6230 CPU @ 2.10GHz
  cores: 40
  threads: 80
  ram_mb: 257530
  architecture: x86_64
  features:
  - fma
  - sse4_1
  - sse4_2
  - avx
  - f16c
  - avx2
  - avx512f
  - avx512_vnni
  runtime_base_mb:
    compiled: 803
    triton: 207
  # the loaders' parallel reads, MEASURED on the rack (tools/measure_io_workers.py, the 29 Qwen3-30B shards on
  # the RDMA cache, 2026-10-30: 6149 / 6241 MiB/s at 16 in two steady runs)
  io_workers: 16
