# AMD CDNA3 Architecture Compute Configuration
# MI300A (gfx940/gfx941), MI300X (gfx942)
#
# validation_status: hand_curated_from_docs
#   No AMD CDNA hardware available locally (V100 only). Pre-existing
#   keys are hand-curated from ROCm/HIP + AMD Instinct documentation
#   and were NOT empirically validated here. The
#   `memory.sdpa_math_max_scores_bytes` key was added 2026-05-19
#   (P-TRITON-MOE-DETERMINISM-RESIDUAL) for R10 schema parity with
#   volta.yml; its value/rationale is documented inline.

architecture: cdna3
compute_capability: "gfx942"  # MI300X (MI300A = gfx940/gfx941)

# Device string mapping - HIP uses CUDA-like API via ROCm
# PyTorch on ROCm still uses "cuda" device string
device_prefix: "cuda"

# Kernel block sizes - AMD CDNA-optimized
block_sizes:
  # Default block size for simple kernels
  default: 1024

  # GEMM configuration - Matrix Core optimized
  gemm:
    block_m: 64
    block_n: 64
    block_k: 16          # Smaller K for AMD
    num_warps: 4
    num_stages: 2

  # Batched Matrix Multiply configuration
  bmm:
    block_m: 64
    block_n: 64
    block_k: 16
    num_warps: 4

  # Convolution configuration
  conv2d:
    block_h: 16
    block_w: 16
    num_warps: 4

  # Resize/interpolation block size
  resize: 256

  # Softmax maximum reduction width
  softmax_cap: 8192

  # LayerNorm tile width
  layernorm_tile: 1024

  # GroupNorm maximum elements per group
  groupnorm_cap: 65536

  # Generic reduction block size
  reduction: 1024
  # M=1 dequant-GEMV occupancy rule — see nvidia/volta.yml for the
  # full rationale (pinned parity BLOCK_N under-fills small-N grids;
  # the wrapper halves BLOCK_N until the grid reaches min_programs).
  # 608 = 2 waves x 304 CUs (MI300X); validation_status: analytical.
  # Key absent or 0 -> no adaptation.
  dequant_gemv:
    min_programs: 608

# Scaled Dot-Product Attention block size thresholds.
# Schema documented in volta.yml. Decode entries first.
# Values inherited from CDNA1/2 (conservative for 64 KB). MI300's
# 160 KB LDS allows larger tiles — unmeasured, see the memory note.
sdpa_thresholds:
  # Decode path (seqlen_q ≤ 16)
  - seqlen_q_le: 16
    head_dim_ge: 256
    block_m: 16
    block_n: 16
    num_warps: 4
  - seqlen_q_le: 16
    block_m: 16
    block_n: 32
    num_warps: 4
  # Prefill path (seqlen_q > 16)
  - head_dim_ge: 256
    block_m: 16
    block_n: 16
    num_warps: 4
  - head_dim_ge: 128
    block_m: 32
    block_n: 32
    num_warps: 4
  - head_dim_lt: 128
    block_m: 64
    block_n: 64
    num_warps: 4

# Memory constraints — CDNA3 (MI300) exposes 160 KB LDS per CU, 2.5x
# CDNA1/2. The sdpa_thresholds below are deliberately left at the
# CDNA1/2 tile sizes: larger tiles are the obvious use of that budget,
# but choosing them without hardware would be a guess presented as a
# value. Revisit at first light (docs/internal/amd_first_light.md).
memory:
  max_shared_memory_per_block: 163840   # 160 KB LDS per CU (CDNA3)
  max_registers_per_block: 65536
  # AMD schedules in 64-wide WAVEFRONTS where NVIDIA uses 32-wide warps.
  # Named `warp_size` for schema uniformity, the same convention
  # apple_silicon.yml follows for its SIMD groups: one hardware concept has
  # ONE key across every profile, so a consumer never branches on vendor to
  # find it. Declaring it as `wavefront_size` meant a reader asking for
  # `memory.warp_size` got nothing on AMD and would fall back to 32 — wrong
  # by 2x, silently, on every CDNA card.
  warp_size: 64
  # SDPA deterministic-routing budget (R10 schema parity with
  # volta.yml). 0 = NOT APPLICABLE: the flash-attention
  # non-determinism diagnosed in P-TRITON-MOE-DETERMINISM-RESIDUAL
  # is an NVIDIA Volta-SIMT MMA issue. ROCm/HIP uses a different
  # Triton backend and matrix-core path; the Volta race does not
  # transfer. Left 0 (no routing) until/unless empirically shown
  # otherwise on CDNA hardware. hand_curated_from_docs.
  sdpa_math_max_scores_bytes: 0
  # Row block (alignment and floor) of the chunked deterministic
  # math prefill; the chunk-halving retry on a refused allocation
  # never goes below it.
  sdpa_math_min_chunk_rows: 128
  # Allocator pool: bytes the free-list may keep PARKED per device as a
  # fraction of that device's memory (2026-09-02, pool default-on gate).
  # Beyond it the largest parked blocks go back to the driver, bounding
  # the pool's contribution to the driver watermark (measured +3.4 GB on
  # the xlong int4 row unbounded). 0 = unbounded.
  alloc_pool_parked_cap_fraction: 0.50

  # Triton deferred-free queue policy (audit #2 F1, P-TRITON-LIVE-SET).
  # PRESSURE-SENSITIVE: always drain at `cliff` (throughput ceiling — no
  # runtime regression when the device has headroom), drain EARLY (queue >=
  # floor) only when a throttled driver-free probe shows the device within
  # `pressure_reserve` of capacity (avoids OOM; a slower run that fits beats
  # an OOM). reserve <= 0 or keys absent -> cliff-only (prior behavior).
  deferred_drain_cliff_bytes: 2000000000          # 2 GB — throughput ceiling
  deferred_drain_floor_bytes: 268435456           # 256 MiB — pressure floor
  deferred_drain_pressure_reserve_bytes: 6442450944  # 6 GiB free -> under pressure
  deferred_drain_freecheck_interval: 8            # min ops between free probes

# SMEM budget safety factor — see volta.yml comment. Same 0.7 across
# vendors; if AMD wave64 changes the pipeline overhead, recalibrate.
sdpa_smem_safety: 0.7

# CDNA3 precision support
precision:
  supports_fp16: true
  supports_bf16: true    # CDNA2+ supports BF16
  supports_tf32: false   # AMD does not have TF32
  supports_fp8: true     # MI300 Matrix Cores: FP8 E4M3 / E5M2

# Software-pipelining budget — see nvidia/volta.yml for the schema.
#
# validation_status: conservative_pending_first_light. cp.async is a
# PTX instruction and does not exist on CDNA; Triton's AMD backend
# pipelines through LDS by a different mechanism, so Volta's measured
# fault does not transfer and neither does Ampere's clearance. Until an
# MI-series card measures it, the cap is 2: clamping can only cost
# throughput, while allowing unvalidated pipelining could cost
# correctness. Raising this is a first-light task
# (docs/internal/amd_first_light.md), not a guess to make from here.
pipelining:
  max_num_stages: 2

# Autotune correctness screen. The engine runs every candidate config once and
# compares its result against a reference config's before timing any of them,
# because an autotuner that ranks on speed alone selects whichever WRONG
# kernel is fastest — a kernel that writes half its output does half the
# stores and wins. Measured on Apple 2026-09-07: fp16 mm [64,32]@[32,64] chose
# a config that left half the columns zero.
#
# These are the tolerances that separate "a different but valid summation
# order" from "a different answer". Two configs with different block sizes
# reduce in a different order, so their results differ in the last bits; a
# config that drops output differs by the scale of the output itself. The
# gap between those two is several orders of magnitude, and these sit in it.
#
# Relative to the reference's own magnitude: max|a - b| / max|b|. Integer
# and boolean results are compared BIT-IDENTICALLY and ignore this table —
# there is no valid reordering that changes an integer.
autotune_screen_rtol:
  float16: 2.0e-2
  bfloat16: 4.0e-2
  float32: 1.0e-4
  float64: 1.0e-8

# Above this many bytes of buffer, the autotune correctness screen does not
# run. Screening copies every argument out and back once per candidate, so a
# very large tensor turns a tuning step into hundreds of megabytes of traffic
# — and on unified memory that pressure is the machine's, not a card's.
# MEASURED 2026-09-07: unbounded screening of a 151936-wide softmax perturbed
# six unrelated tests in the same process. A skipped screen is announced, not
# silent.
autotune_screen_max_bytes: 33554432

# ---------------------------------------------------------------------------
# Autotune bucket ladder and tile-extent lattice — INHERITED, 2026-09-22.
#
# The schema gate (tests/unit/kernels/test_smem_budget.py) requires every profile
# to declare what the reference profile declares. These three keys were added to
# nvidia/volta.yml alone when the bucketed-key work landed, so every other
# architecture had NO ladder — and `ladder_for()` answered a step of 1, which is
# EXACT keying, silently. A key explosion with no refusal is the worst of both.
#
# NOT MEASURED ON THIS ARCHITECTURE. The values below are the Volta measurement
# (0.0 %% median and maximum loss on both V100 memory classes, 2026-09-21),
# carried here as a research SEED so the schema is uniform and no consumer reads
# a silent default. They become certified for this architecture only when its own
# certification proves them against the fp64 oracle — which is stage two's job,
# per hardware profile and memory class. Until then this is a starting
# neighbourhood, not a claim.
#
# The one corroboration that exists: apple/apple_m4_pro measured its own
# tile-extent lattice independently and landed on the same 16.
# ---------------------------------------------------------------------------
tiling:
  extent_lattice: 16

autotune:
  buckets:
    default:
      - {up_to: 64, step: 1}
      - {up_to: 256, step: 16}
      - {up_to: 1024, step: 32}
      - {up_to: 8192, step: 128}
      # Above 8 192 a QUARTER-OCTAVE, not a 512-step. The 512 tail was decided by a sweep
      # that ran to about 4 096 and never met a request-scale dimension: a vocoder's batched
      # GEMM keys on the WAVEFORM and reaches 1 963 520, which a 512-step cuts into some four
      # thousand buckets — 1 400 of one model's 1 522 distinct M values sat above 8 192.
      # Measured 2026-09-22 on both classes, two shapes (the vocoder's B=1,N=1,K=9 and a
      # GEMM at N=K=512), each octave bucket carrying three or four measured values with its
      # TOP as representative: 0.0 % median loss, 0.2 % max at ONE octave bucket. The rows
      # below are finer than the octave that was measured, so they cost no more than it did.
      # The first three octaves above the knee keep a NARROW step. Measured directly on the
      # rows as shipped (the upscalers' N=360, K=180; three sizes inside each bucket with
      # its TOP among them, 2026-09-22): a quarter-octave there cost 0.0 % median but
      # **5.2 %** at the 10 240 bucket and 1.2 % at 16 384 — the loss lives just above the
      # knee, where a quarter of an OCTAVE is still a quarter of the VALUE. Beyond 65 536
      # the same sweep measured 0.0 % median and at most 0.6 %, so the quarter-octave stands.
      # The convolution-width ladder below keeps its quarter-octave: its own sweep measured
      # 0.0 % median AND max there, on both classes and two channel counts.
      - {up_to: 16384, step: 512}
      - {up_to: 32768, step: 1024}
      - {up_to: 65536, step: 2048}
      - {up_to: 131072, step: 16384}
      - {up_to: 262144, step: 32768}
      - {up_to: 524288, step: 65536}
      - {up_to: 1048576, step: 131072}
      - {up_to: 2097152, step: 262144}
      - {up_to: null, step: 524288}
    # The width of a ONE-ROW convolution (a 1-D convolution over a sequence: a vocoder's
    # samples, a mel spectrogram's frames) is the request's length, unbounded by any
    # resolution — chatterbox's vocoder reaches 444 721 samples for 18 s of speech. Above the
    # GEMM ladder it steps by a quarter-octave (≤ 25 % of the value), so a census meets every
    # class of a speech length in ~100 runs instead of ~1 000; the loss of that step is owed a
    # measurement on both classes (bucket_loss.py) before the ladder is called final.
    W:
      - {up_to: 64, step: 1}
      - {up_to: 256, step: 16}
      - {up_to: 1024, step: 32}
      - {up_to: 8192, step: 128}
      - {up_to: 16384, step: 2048}
      - {up_to: 32768, step: 4096}
      - {up_to: 65536, step: 8192}
      - {up_to: 131072, step: 16384}
      - {up_to: 262144, step: 32768}
      - {up_to: 524288, step: 65536}
      - {up_to: null, step: 131072}
