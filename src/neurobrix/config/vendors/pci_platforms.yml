# The GPU platforms the operating system lists, by PCI id — what first-launch detection (core/prism/autodetect.py)
# reads to NAME a chip it found on the PCI bus (Linux: /sys/bus/pci/devices; Windows: Win32_VideoController's
# PNPDeviceID), to say whether it is integrated (it shares the host's memory) or discrete, and why no backend drives it
# when none does. Whether a chip is DRIVEN is not decided here: a chip is driven when a device file lists its PCI id
# (nbxtensor/backend/devices/<vendor>/*.yml, `pci_device_ids`) and its runtime reports it (Intel: Level Zero, which
# also states the integration, the memory and the largest allocation of the device, measured at generation).
#
# Sources, read 2026-11-08:
# - ids: Linux include/drm/intel/pciids.h (torvalds/linux master,
#   https://raw.githubusercontent.com/torvalds/linux/master/include/drm/intel/pciids.h), each row's macro expanded;
#   the Meteor Lake row less its U ids is the MTL macro's own three.
# - integrated: Linux drivers/gpu/drm/xe/xe_pci.c, each platform descriptor's `.is_dgfx` (1: dg1, ats_m, dg2, pvc,
#   bmg, cri; 0: tgl, rkl, adl_s, adl_p, adl_n, mtl, lnl, ptl, nvls, nvlp; RPL-U/P read adl_p's, RPL-S adl_s's, ARL
#   mtl's, WCL ptl's); the Gen9-Gen11 rows are i915-only platforms, all integrated (i915_pci.c: no local memory).
# - no_target: a key of `intel.no_target` — why no backend can drive the platform, with its source. A row without it
#   is driven as soon as a device file lists its ids; ids no device file lists are refused by name, saying so.
intel:
  vendor_id: 0x8086
  no_target:              # why no backend drives a platform, named by its rows
    gen9_to_gen12: "Intel's Triton backend names no compile target for it (intel-xpu-backend-for-triton v3.8.0, third_party/intel/backend/arch_parser.c), and PyTorch's XPU support lists no such GPU (docs.pytorch.org/docs/2.15/notes/get_start_xpu.html)"
    wildcat_lake: "Intel's Triton backend maps no Wildcat Lake architecture (arch_parser.c v3.8.0 has no case for SYCL's intel_gpu_wcl)"
  platforms:
    - platform: "Skylake (Gen9)"
      integrated: true
      source: INTEL_SKL_IDS
      ids: [0x1906, 0x1913, 0x190E, 0x1915, 0x1902, 0x190A, 0x190B, 0x1917, 0x1916, 0x1921, 0x191E, 0x1912, 0x191A, 0x191B, 0x191D, 0x1923, 0x1926, 0x1927, 0x192A, 0x192B, 0x192D, 0x1932, 0x193A, 0x193B, 0x193D]
      no_target: gen9_to_gen12
