# Apple M4 Pro — one file, one reported variant.
#
# The backend names the variant from the device: `Apple M4 Pro` is
# reported as `apple-m4-pro`. A profile whose compute_capability equals
# that string is an EXACT match and wins over the family profile;
# that is the whole mechanism, and it lives in
# kernels/ops/_configs.py::_remember_profile.
#
# Every value below was MEASURED on this exact variant
# (Apple M4 Pro) unless a key says otherwise.
#
# Complete and standalone by design: no pointer, no runtime
# inheritance. Editing this file cannot move a number in another
# variant's. The duplication is paid for by
# tests/unit/config/test_apple_profiles_agree_with_the_device.py,
# which reads every Apple profile and confronts the architectural
# limits against what the device reports — a copy left behind is a
# red test, never a false picture.

gpu_family: "apple9"   # provenance: inherited, 2026-09-10

# Metal exposes no CUDA-style device string. The compiled (PyTorch) path
# reaches Apple GPUs through the MPS backend, whose device string is "mps".
device_prefix: "mps"

# Kernel block sizes — Apple GPUs execute in 32-wide SIMD groups (like a
# warp) with a 1024-thread threadgroup ceiling, so the NVIDIA-shaped
# defaults transfer in structure. Tile sizes are deliberately conservative
# for the 32 KB threadgroup-memory budget, which is a QUARTER of Volta's
# 96 KB — the tightest constraint on this platform.
block_sizes:
  # GEMM — Apple's simdgroup_matrix units are the equivalent of tensor
  # cores. Kept small until the 32 KB budget is measured rather than assumed.
  gemm:
    block_m: 32
    block_n: 32
    block_k: 32
    num_warps: 4
    num_stages: 2

  resize: 256
  softmax_cap: 8192
  layernorm_tile: 1024
  groupnorm_cap: 65536
memory:
  # What the Triton arena holds while a component runs WHOLE, as a multiple of the walked activation figure (the live set
  # op by op), read by `PrismSolver._live_activation_mb`. MEASURED 2026-10-28 19:03 on this Mac, after S4a (split and
  # coalesce) and S4b (no parked block survives a device growth): HAT-L x4 triton at the judged request through the entry
  # point (prism-load-overlap 07df503b + 2449cc2e), NBX_LIVE_WATERMARK_TRACE every op: allocator live peak 7 579 MB at
  # aten._softmax::6 = weights 157 + live tensors 3 882 + the pool's parked blocks 3 540, for a walk of 6 215 MB:
  # (7 579 - 157) / 6 215 = 1.19. The live tensors alone are 0.62x the walk: the excess is the pool's parking.
  # Output bit-equal to the judged artefact (7ab1111f). Native on the same request: 10 113 MB (sampled MPS driver).
  triton_arena_activation_factor: 1.19
  # What the DRIVER holds for a temporal-stream chunk on the compiled engine, as a multiple of the chunk's PRICE (the
  # profiler's figure), per component family (the container's component name): MPS's heaps kept across the chunk's
  # ops and its other allocations are inside it, so the chunk is checked against the device limit less the engine's
  # base, the private reserve not taken again (decision C1, the supervisor 2026-10-27 07:30). MEASURED 2026-10-26
  # 23:4x on the M4 Pro (torch 2.14.0, macOS 27.0.1): mochi-1-preview native at 480x848x25, VAE chunks [1,1,1,1,1]
  # priced 10 159 MB, driver peak 17 714 MB (a 1 ms sampler of torch.mps.driver_allocated_memory), the run green;
  # results/heap_slack_2026_10_26/MEASURE.md. A family not listed is priced at its tensors (the door covers it).
  compiled_stream_driver_over_price:
    vae: {ratio: 1.744, source: "M4 Pro 2026-10-26: mochi-1-preview VAE 1-frame chunk, driver 17714 MB / price 10159 MB"}
  # THE COMPILED ENGINE'S ATTENTION. PyTorch's MPS scaled_dot_product_attention is "just the math implementation,
  # but fused into a single MPSGraph or Metal shader" — "not an implementation of the Flash Attention algorithm"; no
  # memory-efficient kernel on MPS (pytorch/pytorch#179294, maintainer, 2026-04). It writes the full [B, H, Tq, Tk]
  # scores: Allegro native at 720x1280 (79 200 tokens) added ~13 GB in the transformer's first second on an M4 Pro
  # (the Mac, 2026-10-15). Prism prices those scores and the compiled engine runs such an attention in query chunks
  # (core/prism/attention_scratch.py): each chunk's fp32 scores within this fraction of the device's memory, its rows
  # a multiple of this file's sdpa_math_min_chunk_rows.
  compiled_sdpa_full_scores: true
  # THE COMPILED ENGINE'S CONV3D WORKSPACE, beside its input and output, as a fraction of its input's bytes: MPS's
  # conv3d takes about its input's size on top (a layout copy). MEASURED 2026-10-17 on an M4 Pro by the Mac
  # (_agents/archives/mac.conv3d_mps_mem_probe.py, bf16 3x3x3 96->96): input (2,96,26,512,512), in+out 4 782 MB -> 2 514 MB
  # extra; (2,96,26,256,256) -> 633 MB; (2,96,6,512,512) -> 643 MB. Wan2.1-VACE's encoder chunk ran 19.3 GB against
  # 10.9 GB priced without it.
  compiled_conv3d_workspace_input_fraction: 1.0
  # What the compiled engine's other ops hold beside input, output and operand copies while they run, per op type, as a
  # fraction of the op's first input's bytes (core/prism/op_workspace.py). MPS decomposes aten::linalg_vector_norm into
  # full-size intermediates before the fp32 copy the wrapper makes: VACE's 52-frame encoder chunk held 9.95 GiB at that op
  # where the price said 3.2 GB live (the Mac, 2026-10-18 08:10). `null` = declared, not measured: a plan holding the op is
  # refused by name on this device until the Mac's ceiling bisection of the op alone (T = 4, 8, 16) writes the value.
  compiled_op_workspace:
    aten::linalg_vector_norm: 0.01   # MEASURED 2026-10-18 on the M4 Pro (MPS, torch 2.14): the op alone, fp32 (1,96,T,512,512), dim 1, ceiling bisection: 0.01 x input at T 8 and 16 (a fixed ~650 MB floor at T 4)
  # The compiled engine's allocator retention (core/runtime/graph/compiled_sequence.py `_release_from`, `_kill`): MPS gives a tensor of at
  # least kXLargeHeap / 2 = 512 MiB a dedicated heap (OVERSIZE), rounded up to kRoundLarge = 2 MiB, and keeps it
  # cached once freed, serving only a later tensor that fits in it; cached heaps return only through garbage
  # collection above the low watermark (aten/src/ATen/mps/MPSAllocator.h). Measured: Open-Sora-v2's VAE decode, live
  # 0.5-3.8 GB while the driver climbed to 21.2 GB as the upsampled tensors grew (the Mac, 2026-10-23 14:57).
  compiled_allocator_retention:
    dedicated_heap_min_bytes: 536870912
    round_bytes: 2097152
  compiled_sdpa_scores_device_fraction: 0.1     # provenance: chosen 2026-10-15 under the plan's activation headroom; the Mac measures it
  # MPS runs asynchronously: a chunk's freed scores stay unusable until the GPU has run the command that used them, so
  # chunks enqueued without a wait are all alive at once (the Mac, 2026-10-15 08:01: Allegro 720x1280, 672 chunks of
  # 1.8 GB -> 21.3 GB of IOAccelerator buffers within one second, flat at the allocator's cap). The engine waits for the
  # device every this many chunks, and Prism prices that many chunks' scores within the budget.
  compiled_sdpa_chunks_in_flight: 2              # provenance: one chunk computing while the next is enqueued
  # How far the compiled engine's MPS pool may grow, a fraction of the device's recommended working set
  # (core/runtime/torch_allocator.py). torch's default 1.7 let the pool keep the freed buffers of a cut attention and
  # grow past the working set into swap (Allegro 720x1280: 23.7 GB footprint on a 17.8 GB working set, the Mac,
  # 2026-10-15 08:30); bounded, the allocator releases its cached blocks before it grows.
  compiled_allocator_memory_fraction: 1.0           # provenance: the device's own working set, the figure Prism plans in
  # MPS's pool (2026-10-18, the M4 Pro; torch 2.14): see core/runtime/torch_allocator.LOW_WATERMARK_KEY. 0.2 = VACE's encoder
  # stream completes in the full run (0.5 still overran, the default 1.4 let the cache reach 31 GB).
  compiled_allocator_low_watermark_ratio: 0.2
  # MEASURED 2026-10-18 on the M4 Pro: MPS's "other allocations" (outside torch's) at the OOM of five VACE runs: 3.08-3.77
  # GiB; the maximum, rounded up: memory a compiled plan never prices, taken off the unified room (core/prism/solver.py).
  compiled_private_reserve_mb: 3900

  # State pages (state engine step 2, core/state/price.paged_cache_params): the granule a page row is placed at.
  # MEASURED 2026-10-16 on the M4 Pro: `MTLDevice.heapBufferSizeAndAlignWithLength:options:` (shared storage) returns
  # align 256 for every length from 1 B to 1 MiB — the placement unit Metal itself uses for a buffer in a heap.
  state_page_granule_bytes: 256
  # A released page returns to the pool at once, on both Metal engines as built: the pool is fixed (never handed back to
  # an allocator) and every write into a page is GPU work on the queue that reads it (Triton branch: the append and the
  # copy-on-write copy are kernels on the Apple backend's queue; compiled branch: index_copy on the one MPS stream), and
  # Metal runs one queue's command buffers in enqueue order, and commit enqueues (MTLCommandBuffer.commit documentation).
  # A path that wrote a page from the host or from another queue would need true here and a fence
  # (triton/state_fence.py, core/state/mps_fence.py).
  async_release: false
  # Allocator pool: the most a smallest-fit hit may hand out beyond its request (fraction of the request,
  # kernels/nbx_tensor.DeviceAllocator._pool_fit_slack; Prism's piece-change price reads the same value).
  # 1.0 = the former fixed 2x, kept as validated: on unified memory a refused fit parks the block beside a
  # new allocation, no driver refusal flushing it (discrete cards declare 0.0, volta.yml 2026-10-22).
  alloc_pool_fit_slack_fraction: 1.0

  # Triton deferred-free queue policy. Unified memory means a free returns
  # pages to the whole system, so the cliff is lower than on a discrete GPU.
  deferred_drain_cliff_bytes: 1000000000
  deferred_drain_floor_bytes: 268435456
  deferred_drain_pressure_reserve_bytes: 4294967296
  deferred_drain_freecheck_interval: 8

# SMEM budget safety factor — see volta.yml. Same 0.7 across vendors.
sdpa_smem_safety: 0.7

# How kernels are COMPILED on this vendor. Not a tuning knob: both lines
# below decided results or refusals on real kernels, and both were defaults
# nobody chose until an Apple machine made them visible.
shader:
  # Metal Shading Language version. MEASURED 2026-09-06: MTLCompileOptions
  # defaults to 2.4, and `bfloat` — which `precision.supports_bf16` below
  # claims this hardware has — does not exist before 3.1. The first
  # TinyLlama --triton run refused at the embedding kernel with "unknown
  # type name 'bfloat'". 3.1 is the floor that delivers what the profile
  # claims; 3.0 does not (measured: 2.4 NO, 3.0 NO, 3.1 OK, 3.2 OK, 4.0 OK).
  # It pairs with macos_deployment_floor 14.0 below.
  language_version: "3.1"

  # Float policy. MEASURED 2026-09-05: MTLCompileOptions defaults to FAST
  # math (mathMode 2), which lets the compiler reassociate float arithmetic
  # and substitute fast approximations for divide, rsqrt and the
  # transcendentals. Under it rms_norm fp32 at 2x4096 sat 3 ULP from the
  # fp64 oracle where the CUDA reference sits at 1, failing the first-light
  # bar; under "safe" the same kernel is bit-identical to CUDA.
  #
  # safe = IEEE semantics, which is what these kernels are written against
  # on every other backend. relaxed and fast are the other two values Metal
  # accepts; neither is chosen implicitly here.
  math_mode: safe

  # The oldest macOS a compiled metallib must load on. Kept next to the
  # language version because the two move together.
  macos_deployment_floor: "14.0"

precision:
  supports_fp16: true
  supports_bf16: true    # Apple GPU family 9 (M3+); M1/M2 emulate
  supports_tf32: false   # NVIDIA-only format
  supports_fp8: false    # no hardware FP8 on Apple GPUs
  # Metal GPUs have NO double precision at all. The hardware fact stands;
  # the consequence written here did not.
  #
  # MEASURED 2026-09-05: the three device-scalar kernels in
  # kernels/ops/{add,mul,div}.py that widen through f64 do NOT fail to lower
  # and are NOT refused. The f64 survives Triton's middle end intact and the
  # Metal backend's MSL emitter silently narrows it to `float`. For these
  # three that is exact — the product of two f32 values is representable in
  # f64, checked over 20,000,000 random pairs plus subnormals, every one
  # bit-identical — so no host-sync route is needed. What to expect from any
  # FUTURE f64 expression is silent narrowing, not a loud refusal.
  supports_fp64: false
  # Whether each engine branch HOLDS float64 / complex128 tensors at that width where its kernels can
  # -- a DtypeEngine POLICY, not a capability: the Triton branch is fp32-max (its elementwise and
  # index kernels read at fp32 stride) and narrows them to float32 / complex64. Read by
  # `config.device_supports_fp64` and `triton.dtype.triton_stores_fp64`; false narrows.
  stores_fp64:
    compiled: true
    triton: false

# Autotune correctness screen. The engine runs every candidate config once and
# compares its result against a reference config's before timing any of them,
# because an autotuner that ranks on speed alone selects whichever WRONG
# kernel is fastest — a kernel that writes half its output does half the
# stores and wins. Measured on Apple 2026-09-07: fp16 mm [64,32]@[32,64] chose
# a config that left half the columns zero.
#
# These are the tolerances that separate "a different but valid summation
# order" from "a different answer". Two configs with different block sizes
# reduce in a different order, so their results differ in the last bits; a
# config that drops output differs by the scale of the output itself. The
# gap between those two is several orders of magnitude, and these sit in it.
#
# Relative to the reference's own magnitude: max|a - b| / max|b|. Integer
# and boolean results are compared BIT-IDENTICALLY and ignore this table —
# there is no valid reordering that changes an integer.
# The bucket ladder of a request-dependent autotune-key dimension
# (kernels/autotune_bucket.py). A profile that declares NOTHING buckets nothing,
# and until 2026-09-22 this profile declared nothing — so every Apple key was
# exact and a census could only ever cover the requests it was shown.
#
# The rows below are the engine's own rows, lifted from the NVIDIA profile rather
# than retyped, and MEASURED ON THIS CHIP on 2026-09-22 before being kept. A ladder
# measured on V100 is not a ladder measured on an M4 Pro, so it was not assumed.
#
# METAL FIGURES (tools/bucket_loss.py --ladder profile, sizes that SHARE each bucket
# with its top among them per register 84, every bucket read at a duration where this
# chip is measurable — see loss_tolerance above):
#
#   matmul M fp32, 2.20 ms   median 0.0 %, <=1.7 % in ten of twelve buckets
#   matmul M bf16, 1.97 ms   median 0.0 %, <=0.4 % in ten of twelve
#   bmm    M bf16, 2.64 ms   median 0.4 %, <=2.9 % in eleven of twelve
#   bmm    M fp32, 3.9-5.6 ms, 16 sizes a bucket, buckets 112-176: medians 0.3-1.4 %
#   bmm    K fp32, 3.6-13.6 ms, the contraction: max 5.8 % at 1 024, 0.6 % at 2 048,
#                            with the SAME block sizes winning across each bucket
#   conv   W bf16, 0.6-1.6 ms at 4 k-16 k (the widths a vocoder meets; chatterbox
#                            reaches 444 721 samples): medians 0.0 % in all six buckets,
#                            the 2 048-wide quarter-octave buckets included
#
# NO ROW IS NARROWED, and the key-count cost of that decision is zero. The earlier
# Apple readings of 18-99 % were all taken on kernels of 0.3-0.8 ms, where this chip's
# own run-to-run p95 is 51 % — see `loss_tolerance` above, and owed-proofs 2026-09-22.
autotune:
  # The loss below which a bucket cannot be told from THIS CHIP'S OWN NOISE. Derived, never
  # chosen, and only valid for a bucket whose kernels ran inside `band_ms`.
  #
  # MEASURED 2026-09-22 on this M4 Pro, two ways that agree:
  #   1. `tools/bucket_loss.py` swept an identical size list twice (`bmm_M_fp32` and
  #      `bmm_M_fp32_rep2`). The tool seeds from the size, so both runs used the same operand
  #      BYTES and every difference is the machine. Over 350 (size, configuration) pairs the
  #      p95 of the relative difference is 51.08 % below 1 ms, 7.91 % at 1-2 ms, **5.08 % at
  #      2-5 ms**, 14.77 % above 5 ms (unified memory is bandwidth-bound there and shared with
  #      everything else on the machine).
  #   2. `tools/rig_protocol.metal.json` measured the same quantity in 2026-09-17 by re-timing
  #      one fixed shape twelve times: 5.0 % worst-pair at 2.19 ms, 2.1 % at 4.58 ms, ~31 % at
  #      0.6 ms. Different method, different day, same answer.
  #
  # Why it matters more than it looks: the first Apple sweeps ran kernels at 0.3-0.8 ms and
  # read 18-99 % "losses" that vanished at 2-5 ms — the contraction read 65-70 % at 0.5 ms and
  # at most 5.8 % at 6.7 ms. A ladder verdict taken below this band is not a weak verdict, it
  # is no verdict. `bucket_loss.py --evaluate` reads this and says so per bucket.
  # The rows ARE the measurement: p95 of the spread, by the band the kernel ran in. A single
  # figure would hide that this chip is worst below 1 ms AND rises again above 5 ms, where
  # unified memory is bandwidth-bound and shared with every other process on the machine.
  # Certification tries software-pipelining depths 1 and 2 only (the owner's decision, 2026-09-26, inbox 19:14).
  # Upstream's pipeliner is "best effort and helps only in specific configurations, my recommendation is to
  # autotune between ns=1 and ns=2 and use the best" (the triton-ext AppleGPU author,
  # https://github.com/triton-lang/triton-ext/pull/126#issuecomment-5847709477, 2026-09-26). Measured here the
  # same day: at PR #126 head e3c0d60 our pinned depth 4 ran the two named fp32 GEMMs 3.3x slower than depth 1,
  # and at a46d171 depths 1 and 2 time within 0.3 % of each other on five 3x3 convolutions. Every tile is offered at
  # both depths, so there are MORE candidates, not fewer, counted 2026-09-26: matmul, addmm and baddbmm 10 -> 14,
  # conv2d 18 -> 32, depthwise 7 -> 12 (the tiles were listed at depths 2-5, each once). Entries already certified
  # at depth 3-5 stay served until re-certified.
  certify_num_stages: [1, 2]
  loss_tolerance:
    bands:
      - {up_to_ms: 1.0, pct: 51.08}
      - {up_to_ms: 2.0, pct: 7.91}
      - {up_to_ms: 5.0, pct: 5.08}
      - {up_to_ms: null, pct: 14.77}
# The tile-extent lattice — the unit a rung's computed tile is snapped DOWN to
# before it reaches the conv kernels. An unaligned extent runs the kernel
# masked at every scale (partial blocks) and is ~3x slower; snapping to the
# lattice loses a little tile area and buys the cliff. Measured on Metal the
# way volta.yml measured it for the V100, with a FIXED conv config
# (NBX_DISABLE_AUTOTUNE=1) so alignment is the only variable — conv 64->64
# 3x3 pad1 bf16, two tile bands, ms per call:
#
#   band ~457 (rung 8192):  457(odd) 20.9 · 456(÷8) 21.3 · 448(÷16) 7.9 ·
#                           432(÷16) 7.3 · 400(÷16) 6.3 · 416(÷32) 7.7 ·
#                           384(÷32) 6.6   -> ÷16 is the plateau, ÷8 is not
#   band ~200:              201(odd) 4.6 · 200(÷8) 4.5 · 208(÷16) 2.08 ·
#                           192(÷16) 1.88 · 176(÷16) 1.62 · 224(÷32) 2.35 ·
#                           192(÷32) 1.82  -> same plateau, rung-independent
#
# The unit is 16, NOT 32: multiples of 16 that are not multiples of 32 sit on
# the fast plateau, and ÷32 buys nothing per unit area (192 measured 1.88 as
# ÷16 and 1.82 as ÷32 — within the drift; 448 repeated 7.86/8.09, <3%). Metal
# has a 32-wide SIMD and its answer is still 16, so this could not be inferred
# from the warp/SIMD width — it is the conv kernel's inner blocking, measured.
# Same unit as Volta; a coincidence of value, not of derivation. Snapping
# 457->448 spends 3.9% of the tile's area for the 2.7x cliff.
tiling:
  extent_lattice: 16

# ---------------------------------------------------------------------------
# (2026-09-26) An "Autotune bucket ladder ... INHERITED" block stood here: Volta's ladder
# carried to every profile as a research seed (fe2e6b60, 2026-09-22), written as a SECOND
# top-level `autotune:` key. YAML keeps the last of two equal keys, so it silently replaced
# the measured `autotune:` block above — same bucket values, but the chip's measured
# `loss_tolerance` bands were dropped and `tools/bucket_loss.py --evaluate` read none.
# This chip's ladder is the measured one above; the duplicate is refused by
# tests/unit/config/test_config_yaml_has_no_duplicate_keys.py.
# ---------------------------------------------------------------------------

# The machine's measured facts, read by Prism's time estimate (docs/design/prism-time-score.md §1) whenever the device
# profile carries none — this Mac's hardware profile is auto-generated (default-9f169c79), so the architecture's vendor
# file holds them. On unified memory h2d / d2h are copies WITHIN the one pool (~1/4 of the device copy) and free no
# capacity: an offload's relief here is 0, its price the copy. storage_read_gbps is not measured: the only shards in
# reach are on the NAS over Wi-Fi (~9 MB/s), which would measure the link (the estimate refuses cpu_streaming by name).
measured:
  # the 05:16 run measured float16 6.0 / float32 5.2, 224, 58.4, 65.1, 65.3 — within 3 % of this one, which adds the
  # bf16 GEMM the compute dtype of this device needs (the time estimate refused every accelerator strategy without it)
  source: "measured 2026-10-25 18:37:27 CET on the M4 Pro (card 0), alone, the Windows VM off (tools/profile_facts.py --dtypes float16,float32,bfloat16)"
  matmul_tflops: {float16: 6.0, float32: 5.3, bfloat16: 5.9}
  memory_gbps: 230
  h2d_gbps: 59.3
  d2h_gbps: 66.1
  h2d_pageable_gbps: 66.3
  # the engines' loaders, GB/s landed — measured 2026-10-27 21:48 CET on the M4 Pro by the Mac, alone (loader-rates-tool 6a8e1175 + eb15e505 cold drop msync MS_INVALIDATE): Janus-Pro-7B:language_model BF16 3.1 GB, CogVideoX-2b:transformer F16 3.0 GB, F32 re-measured 2026-10-28 01:1x on stable 58b39d7e on PixArt-XL-2-1024-MS:transformer F32 2.4 GB (the Mac, results/loader_f32_2026_10_28/run.log); compiled F16 host predates the pin fix 8d294144
  weight_load_gbps:
    triton:
      BF16: {device: {cold: 2.38, warm: 12.28}, host: {cold: 1.55, warm: 3.0}}
      F16: {device: {cold: 2.4, warm: 6.38}, host: {cold: 3.17, warm: 5.51}}
      F32: {device: {cold: 1.43, warm: 4.0}, host: {cold: 1.56, warm: 4.09}}
    compiled:
      BF16: {device: {cold: 1.56, warm: 10.07}, host: {cold: 1.37, warm: 10.45}}
      F16: {device: {cold: 1.67, warm: 7.21}, host: {cold: 72.35, warm: 360.69}}
      F32: {device: {cold: 0.82, warm: 5.21}, host: {cold: 0.85, warm: 5.94}}
  # the decode-shaped matvec (x[1,4096] @ W[14336,4096]^T, 50 launches) per engine and dtype, GB/s of weights read —
  # measured 2026-10-28 01:46-01:56 CET on the M4 Pro (card 0) by the Mac, alone, the VM off, gemv-facts cfd9e2ff
  # (tools/profile_facts.py --card 0 --dtypes float16,bfloat16,float32; atelier results/gemv_2026_10_28/run.log)
  gemv_gbps:
    triton: {float16: 65.0, bfloat16: 67.5, float32: 73.2}
    compiled: {float16: 247.3, bfloat16: 260.3, float32: 256.0}
host_measured:
  source: "measured 2026-10-25 18:37:27 CET on the M4 Pro host, alone (tools/profile_facts.py)"
  host_matmul_gflops: 3125
  host_memory_gbps: 132
  # what the loader takes to RELOAD a streamed piece's weights onto the device (container read through the page cache,
  # decode, bf16->fp16 conversion, upload), measured on Janus-Pro-7B triton 2026-10-27 19:0x on stable f8def0b9: the
  # language model's 2 segments (13.8 GB together, fp16) re-read 716 times in 2 348 s -> 3.28 s per 6.9 GB segment
  weight_reload_gbps: 2.1
  # what a sliced stretch whose inputs wait on the host moves through host memory per second (its slices cut from the
  # host tensors + its outputs assembled), measured IN SITU by the Mac 2026-10-28 05:12-05:16 on stable 58b39d7e
  # (mochi-1-preview native at an imposed 8 GB rung, per-call timing inside each pass, synced): the two host-read
  # stretches moved 9.9 GiB each (halo included) in 3.61 s and 3.32 s of take_slice + put_slice -> 3.06 GB/s
  # (atelier results/s6_price_2026_10_28/MEASURE.md, diagnosis 4b)
  host_slab_gbps: 3.06
