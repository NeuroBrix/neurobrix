# Apple M1 Ultra — one file, one reported variant.
#
# The backend names the variant from the device: `Apple M1 Ultra` is
# reported as `apple-m1-ultra`. A profile whose compute_capability equals
# that string is an EXACT match and wins over the family profile;
# that is the whole mechanism, and it lives in
# kernels/ops/_configs.py::_remember_profile.
#
# NOTHING below was measured on Apple M1 Ultra: this project has no such
# machine. Every value is INHERITED from the family profile
# `apple_silicon.yml` as it stood on 2026-09-10, which itself carries
# values measured on Apple M4 Pro.
#
# That is a statement about provenance, not about correctness: the
# hard limits (1024 threads per threadgroup, 32 KB of threadgroup
# memory) are architectural and hold across the M-series. What an
# inherited value cannot claim is that a TILE CHOICE is the right
# one here — an Ultra has eight times the base chip's GPU and is
# served worst by an average.
#
# Complete and standalone by design: no pointer, no runtime
# inheritance. Editing this file cannot move a number in another
# variant's. The duplication is paid for by
# tests/unit/config/test_apple_profiles_agree_with_the_device.py,
# which reads every Apple profile and confronts the architectural
# limits against what the device reports — a copy left behind is a
# red test, never a false picture.

gpu_family: "apple7"   # provenance: inherited, 2026-09-10

# Metal exposes no CUDA-style device string. The compiled (PyTorch) path
# reaches Apple GPUs through the MPS backend, whose device string is "mps".
device_prefix: "mps"

# Kernel block sizes — Apple GPUs execute in 32-wide SIMD groups (like a
# warp) with a 1024-thread threadgroup ceiling, so the NVIDIA-shaped
# defaults transfer in structure. Tile sizes are deliberately conservative
# for the 32 KB threadgroup-memory budget, which is a QUARTER of Volta's
# 96 KB — the tightest constraint on this platform.
block_sizes:
  # GEMM — Apple's simdgroup_matrix units are the equivalent of tensor
  # cores. Kept small until the 32 KB budget is measured rather than assumed.
  gemm:
    block_m: 32
    block_n: 32
    block_k: 32
    num_warps: 4
    num_stages: 2

  resize: 256
  softmax_cap: 8192
  layernorm_tile: 1024
  groupnorm_cap: 65536
memory:
  # the Triton arena's hold over the walked activations, while a component runs whole: not measured on this device —
  # a Triton plan here is refused by name (`PrismSolver._live_activation_mb`)
  triton_arena_activation_factor: null
  compiled_stream_driver_over_price: null   # not measured on this device (C1, 2026-10-27): a stream chunk is priced at its tensors
  # THE COMPILED ENGINE'S ATTENTION. PyTorch's MPS scaled_dot_product_attention is "just the math implementation,
  # but fused into a single MPSGraph or Metal shader" — "not an implementation of the Flash Attention algorithm"; no
  # memory-efficient kernel on MPS (pytorch/pytorch#179294, maintainer, 2026-04). It writes the full [B, H, Tq, Tk]
  # scores: Allegro native at 720x1280 (79 200 tokens) added ~13 GB in the transformer's first second on an M4 Pro
  # (the Mac, 2026-10-15). Prism prices those scores and the compiled engine runs such an attention in query chunks
  # (core/prism/attention_scratch.py): each chunk's fp32 scores within this fraction of the device's memory, its rows
  # a multiple of this file's sdpa_math_min_chunk_rows.
  compiled_sdpa_full_scores: true
  # THE COMPILED ENGINE'S CONV3D WORKSPACE, beside its input and output, as a fraction of its input's bytes: MPS's
  # conv3d takes about its input's size on top (a layout copy). MEASURED 2026-10-17 on an M4 Pro by the Mac
  # (_agents/archives/mac.conv3d_mps_mem_probe.py, bf16 3x3x3 96->96): input (2,96,26,512,512), in+out 4 782 MB -> 2 514 MB
  # extra; (2,96,26,256,256) -> 633 MB; (2,96,6,512,512) -> 643 MB. Wan2.1-VACE's encoder chunk ran 19.3 GB against
  # 10.9 GB priced without it.
  compiled_conv3d_workspace_input_fraction: 1.0
  # What the compiled engine's other ops hold beside input, output and operand copies while they run, per op type, as a
  # fraction of the op's first input's bytes (core/prism/op_workspace.py). MPS decomposes aten::linalg_vector_norm into
  # full-size intermediates before the fp32 copy the wrapper makes: VACE's 52-frame encoder chunk held 9.95 GiB at that op
  # where the price said 3.2 GB live (the Mac, 2026-10-18 08:10). `null` = declared, not measured: a plan holding the op is
  # refused by name on this device until the Mac's ceiling bisection of the op alone (T = 4, 8, 16) writes the value.
  compiled_op_workspace:
    aten::linalg_vector_norm: 0.01   # MEASURED 2026-10-18 on the M4 Pro (MPS, torch 2.14): the op alone, fp32 (1,96,T,512,512), dim 1, ceiling bisection: 0.01 x input at T 8 and 16 (a fixed ~650 MB floor at T 4)
  # The compiled engine's allocator retention (core/runtime/graph/compiled_sequence.py `_release_from`, `_kill`): MPS gives a tensor of at
  # least kXLargeHeap / 2 = 512 MiB a dedicated heap (OVERSIZE), rounded up to kRoundLarge = 2 MiB, and keeps it
  # cached once freed, serving only a later tensor that fits in it; cached heaps return only through garbage
  # collection above the low watermark (aten/src/ATen/mps/MPSAllocator.h). Measured: Open-Sora-v2's VAE decode, live
  # 0.5-3.8 GB while the driver climbed to 21.2 GB as the upsampled tensors grew (the Mac, 2026-10-23 14:57).
  compiled_allocator_retention:
    dedicated_heap_min_bytes: 536870912
    round_bytes: 2097152
  compiled_sdpa_scores_device_fraction: 0.1     # provenance: chosen 2026-10-15 under the plan's activation headroom; the Mac measures it
  # MPS runs asynchronously: a chunk's freed scores stay unusable until the GPU has run the command that used them, so
  # chunks enqueued without a wait are all alive at once (the Mac, 2026-10-15 08:01: Allegro 720x1280, 672 chunks of
  # 1.8 GB -> 21.3 GB of IOAccelerator buffers within one second, flat at the allocator's cap). The engine waits for the
  # device every this many chunks, and Prism prices that many chunks' scores within the budget.
  compiled_sdpa_chunks_in_flight: 2              # provenance: one chunk computing while the next is enqueued
  # How far the compiled engine's MPS pool may grow, a fraction of the device's recommended working set
  # (core/runtime/torch_allocator.py). torch's default 1.7 let the pool keep the freed buffers of a cut attention and
  # grow past the working set into swap (Allegro 720x1280: 23.7 GB footprint on a 17.8 GB working set, the Mac,
  # 2026-10-15 08:30); bounded, the allocator releases its cached blocks before it grows.
  compiled_allocator_memory_fraction: 1.0           # provenance: the device's own working set, the figure Prism plans in

  # Allocator pool: the most a smallest-fit hit may hand out beyond its request (fraction of the request,
  # kernels/nbx_tensor.DeviceAllocator._pool_fit_slack; Prism's piece-change price reads the same value).
  # 1.0 = the former fixed 2x, kept as validated: on unified memory a refused fit parks the block beside a
  # new allocation, no driver refusal flushing it (discrete cards declare 0.0, volta.yml 2026-10-22).
  alloc_pool_fit_slack_fraction: 1.0

  # Triton deferred-free queue policy. Unified memory means a free returns
  # pages to the whole system, so the cliff is lower than on a discrete GPU.
  deferred_drain_cliff_bytes: 1000000000
  deferred_drain_floor_bytes: 268435456
  deferred_drain_pressure_reserve_bytes: 4294967296
  deferred_drain_freecheck_interval: 8

# SMEM budget safety factor — see volta.yml. Same 0.7 across vendors.
sdpa_smem_safety: 0.7

# How kernels are COMPILED on this vendor. Not a tuning knob: both lines
# below decided results or refusals on real kernels, and both were defaults
# nobody chose until an Apple machine made them visible.
shader:
  # Metal Shading Language version. MEASURED 2026-09-06: MTLCompileOptions
  # defaults to 2.4, and `bfloat` — which `precision.supports_bf16` below
  # claims this hardware has — does not exist before 3.1. The first
  # TinyLlama --triton run refused at the embedding kernel with "unknown
  # type name 'bfloat'". 3.1 is the floor that delivers what the profile
  # claims; 3.0 does not (measured: 2.4 NO, 3.0 NO, 3.1 OK, 3.2 OK, 4.0 OK).
  # It pairs with macos_deployment_floor 14.0 below.
  language_version: "3.1"

  # Float policy. MEASURED 2026-09-05: MTLCompileOptions defaults to FAST
  # math (mathMode 2), which lets the compiler reassociate float arithmetic
  # and substitute fast approximations for divide, rsqrt and the
  # transcendentals. Under it rms_norm fp32 at 2x4096 sat 3 ULP from the
  # fp64 oracle where the CUDA reference sits at 1, failing the first-light
  # bar; under "safe" the same kernel is bit-identical to CUDA.
  #
  # safe = IEEE semantics, which is what these kernels are written against
  # on every other backend. relaxed and fast are the other two values Metal
  # accepts; neither is chosen implicitly here.
  math_mode: safe

  # The oldest macOS a compiled metallib must load on. Kept next to the
  # language version because the two move together.
  macos_deployment_floor: "14.0"

precision:
  supports_fp16: true
  supports_bf16: true    # Apple GPU family 9 (M3+); M1/M2 emulate
  supports_tf32: false   # NVIDIA-only format
  supports_fp8: false    # no hardware FP8 on Apple GPUs
  # Metal GPUs have NO double precision at all. The hardware fact stands;
  # the consequence written here did not.
  #
  # MEASURED 2026-09-05: the three device-scalar kernels in
  # kernels/ops/{add,mul,div}.py that widen through f64 do NOT fail to lower
  # and are NOT refused. The f64 survives Triton's middle end intact and the
  # Metal backend's MSL emitter silently narrows it to `float`. For these
  # three that is exact — the product of two f32 values is representable in
  # f64, checked over 20,000,000 random pairs plus subnormals, every one
  # bit-identical — so no host-sync route is needed. What to expect from any
  # FUTURE f64 expression is silent narrowing, not a loud refusal.
  supports_fp64: false
  # Whether each engine branch HOLDS float64 / complex128 tensors at that width where its kernels can
  # -- a DtypeEngine POLICY, not a capability: the Triton branch is fp32-max (its elementwise and
  # index kernels read at fp32 stride) and narrows them to float32 / complex64. Read by
  # `config.device_supports_fp64` and `triton.dtype.triton_stores_fp64`; false narrows.
  stores_fp64:
    compiled: true
    triton: false

# ---------------------------------------------------------------------------
# Autotune bucket ladder and tile-extent lattice — INHERITED, 2026-09-22.
#
# The schema gate (tests/unit/kernels/test_smem_budget.py) requires every profile
# to declare what the reference profile declares. These three keys were added to
# nvidia/volta.yml alone when the bucketed-key work landed, so every other
# architecture had NO ladder — and `ladder_for()` answered a step of 1, which is
# EXACT keying, silently. A key explosion with no refusal is the worst of both.
#
# NOT MEASURED ON THIS ARCHITECTURE. The values below are the Volta measurement
# (0.0 %% median and maximum loss on both V100 memory classes, 2026-09-21),
# carried here as a research SEED so the schema is uniform and no consumer reads
# a silent default. They become certified for this architecture only when its own
# certification proves them against the fp64 oracle — which is stage two's job,
# per hardware profile and memory class. Until then this is a starting
# neighbourhood, not a claim.
#
# The one corroboration that exists: apple/apple_m4_pro measured its own
# tile-extent lattice independently and landed on the same 16.
# ---------------------------------------------------------------------------
tiling:
  extent_lattice: 16

