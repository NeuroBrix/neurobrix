# NVIDIA Ampere Architecture Compute Configuration
# A100, A30, A10, RTX 30xx series, Quadro RTX A-series
# Compute Capability: 8.0 (A100), 8.6 (RTX 30xx)
#
# validation_status: hand_curated_from_docs
#   No Ampere hardware available locally (V100 only). Pre-existing
#   keys are hand-curated from NVIDIA Ampere/A100 documentation and
#   were NOT empirically validated here. The
#   `memory.sdpa_math_max_scores_bytes` key was added 2026-05-19
#   (P-TRITON-MOE-DETERMINISM-RESIDUAL) for R10 schema parity with
#   volta.yml; its value/rationale is documented inline.

# Device string mapping
device_prefix: "cuda"

# Kernel block sizes - Ampere-optimized (larger tiles, more parallelism)
block_sizes:
  # GEMM configuration - larger tiles for A100
  gemm:
    block_m: 128         # Larger tiles for Ampere
    block_n: 128
    block_k: 32
    num_warps: 8         # More warps for higher parallelism
    num_stages: 3        # More pipeline stages

  # Resize/interpolation block size
  resize: 256

  # Softmax maximum reduction width
  softmax_cap: 8192

  # LayerNorm tile width
  layernorm_tile: 1024

  # GroupNorm maximum elements per group
  groupnorm_cap: 65536

# Memory constraints. A100 SMEM/SM = 167936 (164 KB). Other Ampere
# parts (A30, A10, RTX 30xx) have less SMEM but the picker's safety
# factor + cascade fallback keeps them safe.
memory:
  # the Triton arena's hold over the walked activations, while a component runs whole: not measured on this device —
  # a Triton plan here is refused by name (`PrismSolver._live_activation_mb`)
  triton_arena_activation_factor: null
  compiled_stream_driver_over_price: null   # not measured on this device (C1, 2026-10-27): a stream chunk is priced at its tensors
  # The compiled engine's torch caching allocator: see volta.yml (the measured case) and
  # core/runtime/torch_allocator.py. Declared on every NVIDIA and AMD profile.
  compiled_allocator_settings: "expandable_segments:True"
  # THE COMPILED ENGINE'S ATTENTION: PyTorch dispatches scaled_dot_product_attention on this device to its flash or
  # memory-efficient kernels, which never write the full scores (PyTorch SDPA tutorial; the Prism estimate prices
  # the memory-efficient workspace, core/prism/memory_estimator.py). Nothing to chunk.
  compiled_sdpa_full_scores: false
  # THE COMPILED ENGINE'S CONV3D WORKSPACE, beside its input and output, as a fraction of its input's bytes: none to
  # price. cuDNN takes what the caching allocator can give and no more — on an out-of-memory it halves the workspace
  # and drops the plans that need more (pytorch aten/src/ATen/native/cudnn/Conv_v8.cpp, generate_and_filter_plans /
  # try_plans, v2.6.0). Measured 2026-10-17, V100 16 GB: mochi's and Wan's causal-VAE chunks ran beside their price.
  compiled_conv3d_workspace_input_fraction: 0.0
  # Its floor, the bytes a conv3d needs free whatever its size: none — cuDNN's workspace is what the allocator can
  # give (above), so no conv refuses to start under a fixed amount.
  compiled_conv3d_workspace_floor_bytes: 0
  # What the compiled engine's other ops hold beside input, output and operand copies while they run, per op type, as a
  # fraction of the op's first input's bytes (core/prism/op_workspace.py `op_workspace_fractions`). ATen's CUDA reductions
  # and norms run in one kernel pass with no full-size intermediate: none observed in the per-op live probes of the Wan
  # and mochi causal-VAE chunks on V100 (2026-10-17, nbx/tmp/stream_tri_mem.py). An empty table: nothing beyond the price.
  compiled_op_workspace: {}
  # The compiled engine's allocator retention (core/runtime/graph/compiled_sequence.py `_release_from`, `_kill`): null — CUDA's caching
  # allocator splits its segments and reuses a freed block for any request that fits a free range; the V100 per-op
  # trace of Open-Sora-v2's VAE (native, 2026-10-23, campaigns/2026_10_12_mq25_gate/stable/opensora_apple) held the
  # live set within 0.38 GB at every op, nothing retained beyond it.
  compiled_allocator_retention: null
  # The state engine's pages (docs/design/state-engine.md §4.3, core/state/price.page_tokens): a page of one layer is
  # raised to at least this many bytes. Each layer's pool is one contiguous allocation, so the granule that matters is
  # the global-memory transaction a page row is read in: 128-byte lines (NVIDIA CUDA C++ Best Practices Guide,
  # "Coalesced Access to Global Memory": a warp's accesses are served by 32-byte segments of 128-byte cache lines).
  state_page_granule_bytes: 128
  # A released page returns to the pool at once: kernels on one stream run in issue order, so a page granted again is
  # written only after the reads already issued against it (CUDA Programming Guide, "Streams": operations in a stream
  # execute in order). core/state/pages.PagePool(async_release=...).
  async_release: false
  # Allocator pool: the most a smallest-fit hit may hand out beyond its request (fraction of the request,
  # kernels/nbx_tensor.DeviceAllocator._pool_fit_slack): the surplus is held unpriced while the tensor lives.
  # Exact-size hits only, as measured on Volta (volta.yml, 2026-10-22).
  alloc_pool_fit_slack_fraction: 0.0

  # Triton deferred-free queue policy (audit #2 F1, P-TRITON-LIVE-SET).
  # PRESSURE-SENSITIVE: always drain at `cliff` (throughput ceiling — no
  # runtime regression when the device has headroom), drain EARLY (queue >=
  # floor) only when a throttled driver-free probe shows the device within
  # `pressure_reserve` of capacity (avoids OOM; a slower run that fits beats
  # an OOM). reserve <= 0 or keys absent -> cliff-only (prior behavior).
  deferred_drain_cliff_bytes: 2000000000          # 2 GB — throughput ceiling
  deferred_drain_floor_bytes: 268435456           # 256 MiB — pressure floor
  deferred_drain_pressure_reserve_bytes: 6442450944  # 6 GiB free -> under pressure
  deferred_drain_freecheck_interval: 8            # min ops between free probes

# SMEM budget safety factor — see volta.yml comment.
sdpa_smem_safety: 0.7

# Ampere has broader precision support
precision:
  supports_fp16: true
  supports_bf16: true    # Ampere supports BF16
  supports_tf32: true    # Ampere supports TF32
  supports_fp8: false    # Ampere does not support FP8
  # IEEE-754 binary64 in hardware on every CUDA device (CUDA C++ Programming Guide, arithmetic instructions); torch.float64 is native on cuda. Read by the DtypeEngine (`device_supports_fp64`):
  # false narrows float64/complex128 to float32/complex64 as the vendor's own code does on MPS.
  supports_fp64: true
  # Whether each engine branch HOLDS float64 / complex128 tensors at that width where its kernels can
  # -- a DtypeEngine POLICY, not a capability: the Triton branch is fp32-max (its elementwise and
  # index kernels read at fp32 stride) and narrows them to float32 / complex64. Read by
  # `config.device_supports_fp64` and `triton.dtype.triton_stores_fp64`; false narrows.
  stores_fp64:
    compiled: true
    triton: false

# ---------------------------------------------------------------------------
# Autotune bucket ladder and tile-extent lattice — INHERITED, 2026-09-22.
#
# The schema gate (tests/unit/kernels/test_smem_budget.py) requires every profile
# to declare what the reference profile declares. These three keys were added to
# nvidia/volta.yml alone when the bucketed-key work landed, so every other
# architecture had NO ladder — and `ladder_for()` answered a step of 1, which is
# EXACT keying, silently. A key explosion with no refusal is the worst of both.
#
# NOT MEASURED ON THIS ARCHITECTURE. The values below are the Volta measurement
# (0.0 %% median and maximum loss on both V100 memory classes, 2026-09-21),
# carried here as a research SEED so the schema is uniform and no consumer reads
# a silent default. They become certified for this architecture only when its own
# certification proves them against the fp64 oracle — which is stage two's job,
# per hardware profile and memory class. Until then this is a starting
# neighbourhood, not a claim.
#
# The one corroboration that exists: apple/apple_m4_pro measured its own
# tile-extent lattice independently and landed on the same 16.
# ---------------------------------------------------------------------------
tiling:
  extent_lattice: 16

