# NVIDIA Volta Architecture Compute Configuration
# V100 (Tesla, PCIe, SXM2), Titan V, Quadro GV100
# Compute Capability: 7.0
#
# validation_status: validated_empirical
#   This is the only architecture with hardware available
#   (4x V100). Empirically validated end-to-end in
#   P-TRITON-MOE-DETERMINISM-RESIDUAL (2026-05-19): Qwen3-30B-A3B,
#   TinyLlama-1.1B, DeepSeek-MoE-16b, Sana_1600M_1024px (R29 PNG).
#   The `memory.sdpa_math_max_scores_bytes` key is the empirically-
#   derived Ch4bis budget (see its inline justification below).
#   Pre-existing keys (block_sizes / sdpa_thresholds) carry their
#   own inline provenance comments and were not re-audited this
#   workstream.

# Device string mapping - maps vendor to torch device prefix
device_prefix: "cuda"

# Kernel block sizes - architecture-optimized values
block_sizes:
  # GEMM (General Matrix Multiply) configuration
  gemm:
    block_m: 64          # Tile size in M dimension
    block_n: 64          # Tile size in N dimension
    block_k: 32          # Tile size in K dimension
    num_warps: 4         # Number of warps per block
    num_stages: 2        # Pipeline stages

  # Resize/interpolation block size
  resize: 256

  # Softmax maximum reduction width
  softmax_cap: 8192

  # LayerNorm tile width
  layernorm_tile: 1024

  # GroupNorm maximum elements per group
  groupnorm_cap: 65536

# Memory constraints.
#
# max_shared_memory_per_block is the V100 OPT-IN value (96 KB). The
# default per-block SMEM on Volta without opt-in is 48 KB, but Triton
# uses cudaFuncSetAttribute to request the opt-in extended SMEM for
# kernels that need it. Flash-attention is exactly such a kernel —
# our wrapper sizes its tile against the opt-in value. PixArt VAE
# head_dim=512 needs the full 96 KB; the 48 KB default crashes.
# The lattice a tiled extent is snapped down onto before it reaches the kernels — the
# ladder's other half (2026-09-21). The memory reading rounds DOWN onto whole-GB rungs for
# determinism; the tile extent that rung yields is then handed to conv2d as computed, and an
# odd extent runs the kernels masked at every scale. Measured on real-esrgan-x8 at 1024², rung
# 8192 (budget 3.20 GB): tile 457 → 717.9 s under static configs, 456 (a multiple of 8) →
# 544.7 s, 448 / 432 / 416 / 384 (multiples of 16) → 31.5–40.9 s; under production autotune the
# odd tile sweeps 11 unscreened shapes for 2 066 s cold and runs 31.9 s warm, the 448 tile
# lands on certified shapes (20.4 s cold, 19.5 s warm). The unit is 16: multiples of 16 that
# are not multiples of 32 or 64 sit on the same plateau, so a coarser unit only spends tile
# area (384 loses 29 % of the tile for 23 % of the time). 3.9 % of the tile's area buys the
# cliff back whole. Nothing else downstream is rounded (the Mac's ladder law, e3775d33).
# Absent on a profile = the extent as computed (unmeasured there).
tiling:
  extent_lattice: 16

memory:
  compiled_stream_driver_over_price: null   # not measured on this device (C1, 2026-10-27): a stream chunk is priced at its tensors
  # What the Triton runtime holds on the card OUTSIDE every allocator beyond the context read when a plan starts, grown
  # during a run (kernel modules and the local memory the driver reserves as they load): Prism's budget holds it
  # (`PrismSolver._runtime_growth`). The envelope over the models measured, through the entry point on the rack's
  # V100-SXM2 (NBX_LIVE_WATERMARK_TRACE untracked_mb = driver used less the allocator's live, max less the 312 MB context;
  # nbx/campaigns/2026_10_27_mochi_states_parked/s4/wm, 2026-10-28): Wan2.2-I2V-A14B 911, Sana_1600M_4Kpx 742,
  # Flex.1-alpha 716, Janus-Pro-7B 588, deepseek-moe-16b 574, CogVideoX-5b-I2V 250, Allegro 128, mochi 100,
  # Qwen3-VL-30B 88, HAT-L 67 MB.
  triton_runtime_growth_mb: 911
  # What the Triton arena holds while a component runs WHOLE, as a multiple of the walked activation figure (the live set
  # op by op): the pool's parked blocks and the deferred frees sit beside the live tensors. Read by
  # `PrismSolver._live_activation_mb` (the whole, zero3 and tiling-trigger tests). MEASURED on this card before S4a/S4b:
  # CogVideoX-5b's VAE tile ~1.3x (2026-09, 24 GB compiled, 31 GB+ triton for the same tile); mochi-1-preview's whole
  # VAE at 85 frames 320x576, profiled 24 561 MB, died at 25 202 MB live asking 8 493 MB more: >= 1.35x (2026-09-26,
  # card 2). The larger of the two.
  triton_arena_activation_factor: 1.35
  # the compiled engine's: not measured on this device
  compiled_runtime_growth_mb: null
  # The compiled engine's torch caching allocator (core/runtime/torch_allocator.py), applied once
  # per process before a weight loads; the Triton engine never reads it. Expandable segments make
  # the bytes Prism prices the bytes the card hands out: under fixed segments Wan2.1-I2V-14B
  # compiled on a 16 GB V100 (2026-10-05) died asking 2.50 GiB at aten.view_as_complex::4 with
  # 8.52 GiB allocated (the plan's price, 11.0 GiB) and 6.76 GiB reserved-but-unallocated;
  # Allegro-TI2V compiled the same way with 5.93 GiB. The vendor's remedy for that case:
  # https://docs.pytorch.org/docs/2.14/notes/cuda.html#optimizing-memory-usage-with-pytorch-cuda-alloc-conf
  # It is the allocator's behaviour, not this architecture's, so every profile whose vendor
  # allocator implements it declares it: every NVIDIA profile and every AMD one (ROCm's build, see
  # amd/cdna.yml); Apple's MPS allocator has no such setting. An operator's PYTORCH_ALLOC_CONF wins
  # and is logged.
  compiled_allocator_settings: "expandable_segments:True"
  # THE COMPILED ENGINE'S ATTENTION: PyTorch dispatches scaled_dot_product_attention on this device to its flash or
  # memory-efficient kernels, which never write the full scores (PyTorch SDPA tutorial; the Prism estimate prices
  # the memory-efficient workspace, core/prism/memory_estimator.py). Nothing to chunk.
  compiled_sdpa_full_scores: false
  # THE COMPILED ENGINE'S CONV3D WORKSPACE, beside its input and output, as a fraction of its input's bytes: none to
  # price. cuDNN takes what the caching allocator can give and no more — on an out-of-memory it halves the workspace
  # and drops the plans that need more (pytorch aten/src/ATen/native/cudnn/Conv_v8.cpp, generate_and_filter_plans /
  # try_plans, v2.6.0). Measured 2026-10-17, V100 16 GB: mochi's and Wan's causal-VAE chunks ran beside their price.
  compiled_conv3d_workspace_input_fraction: 0.0
  # What the compiled engine's other ops hold beside input, output and operand copies while they run, per op type, as a
  # fraction of the op's first input's bytes (core/prism/op_workspace.py `op_workspace_fractions`). ATen's CUDA reductions
  # and norms run in one kernel pass with no full-size intermediate: none observed in the per-op live probes of the Wan
  # and mochi causal-VAE chunks on V100 (2026-10-17, nbx/tmp/stream_tri_mem.py). An empty table: nothing beyond the price.
  compiled_op_workspace: {}
  # The compiled engine's allocator retention (core/runtime/graph/compiled_sequence.py `_release_from`, `_kill`): null — CUDA's caching
  # allocator splits its segments and reuses a freed block for any request that fits a free range; the V100 per-op
  # trace of Open-Sora-v2's VAE (native, 2026-10-23, campaigns/2026_10_12_mq25_gate/stable/opensora_apple) held the
  # live set within 0.38 GB at every op, nothing retained beyond it.
  compiled_allocator_retention: null
  # The state engine's pages (docs/design/state-engine.md §4.3, core/state/price.page_tokens): a page of one layer is
  # raised to at least this many bytes. Each layer's pool is one contiguous allocation, so the granule that matters is
  # the global-memory transaction a page row is read in: 128-byte lines (NVIDIA CUDA C++ Best Practices Guide,
  # "Coalesced Access to Global Memory": a warp's accesses are served by 32-byte segments of 128-byte cache lines).
  state_page_granule_bytes: 128
  # A released page returns to the pool at once: kernels on one stream run in issue order, so a page granted again is
  # written only after the reads already issued against it (CUDA Programming Guide, "Streams": operations in a stream
  # execute in order). core/state/pages.PagePool(async_release=...).
  async_release: false
  # Allocator pool: the most a smallest-fit hit may hand out BEYOND its request, as a fraction of the
  # request (kernels/nbx_tensor.DeviceAllocator._pool_fit_slack). The surplus stays held, unusable, while
  # the tensor lives, and no plan prices it. At the former fixed 2x, HAT-S at 2048 px on a 16 GB card gave
  # a 2 304 MB conv output a parked 4 096 MB block and its next tile OOMed (2026-10-22). Exact-size hits
  # only: PixArt-Sigma 1024 triton measured the same (30 s wall, driver peak 11 799 MB) at 0.25 and at 0.0,
  # its 455 fits at 0.25 becoming exact hits at 0.0 (NBX_ALLOC_STATS, 2026-10-22).
  alloc_pool_fit_slack_fraction: 0.0
  # Triton deferred-free queue policy (audit #2 F1, P-TRITON-LIVE-SET).
  # PRESSURE-SENSITIVE: the queue always drains at `cliff` (throughput
  # ceiling — identical to the historical 2 GB behavior when the device has
  # headroom, so NO runtime regression), and drains EARLY (queue >= floor)
  # only when a throttled driver-free probe shows the device within
  # `pressure_reserve` of capacity — where a lower watermark is needed to
  # avoid OOM and a slower run that fits beats an OOM. Draining is not free
  # (cudaFree->cudaMalloc with the pool off), so eager draining on a model
  # with headroom is pure churn (a fixed 650 MiB cap regressed CogVideoX-2b
  # VAE ~49% for no benefit — hence the pressure gate). reserve <= 0 or keys
  # absent -> cliff-only (prior behavior).
  deferred_drain_cliff_bytes: 2000000000          # 2 GB — throughput ceiling
  deferred_drain_floor_bytes: 268435456           # 256 MiB — pressure floor
  deferred_drain_pressure_reserve_bytes: 6442450944  # 6 GiB free -> under pressure
  deferred_drain_freecheck_interval: 8            # min ops between free probes

# SMEM budget safety factor — fraction of max_shared_memory_per_block
# that the picker considers usable. Triton's compiler inflates the
# analytical Q+K+V+bias tile footprint by ~1.3× via double-buffered
# pipelining and softmax statistics scratch; 0.7 absorbs that overhead
# with margin. Empirically derived: head_dim=512 fp16 (32, 32) yields
# formula 102 KB while Triton reports 131 KB → factor 1.28 → safety
# 1/1.43 = 0.7.
sdpa_smem_safety: 0.7

# FP16 capabilities
precision:
  supports_fp16: true
  supports_bf16: false   # Volta does not support BF16
  supports_tf32: true   # Volta does not support TF32
  supports_fp8: false    # Volta does not support FP8
  # IEEE-754 binary64 in hardware on every CUDA device (CUDA C++ Programming Guide, arithmetic instructions); torch.float64 is native on cuda. Read by the DtypeEngine (`device_supports_fp64`):
  # false narrows float64/complex128 to float32/complex64 as the vendor's own code does on MPS.
  supports_fp64: true
  # Whether each engine branch HOLDS float64 / complex128 tensors at that width where its kernels can
  # -- a DtypeEngine POLICY, not a capability: the Triton branch is fp32-max (its elementwise and
  # index kernels read at fp32 stride) and narrows them to float32 / complex64. Read by
  # `config.device_supports_fp64` and `triton.dtype.triton_stores_fp64`; false narrows.
  stores_fp64:
    compiled: true
    triton: false

# The measured facts of a V100-SXM2 card, for a hardware profile that carries none (an auto-generated one-card profile
# `default-<tag>`): the time estimate's roofline (core/prism/time_estimate.py) reads them through the loader's vendor
# fallthrough (`_vendor_block`). Measured 2026-10-24 22:38:01 CEST on card 0 of the rack, alone (tools/profile_facts.py),
# the figures of src/neurobrix/config/hardware/c4140-4xv100-custom-nvlink.yml; the 16 GB and 32 GB SKUs share the
# GV100 die at the protocol clock (1290 MHz) and measured within 1.3 % of each other (789 vs 779 GB/s, point B).
measured:
  source: "measured 2026-10-24 22:38:01 CEST on card 0 of the rack, alone (tools/profile_facts.py); copied here 2026-10-25 for the generated one-card profiles"
  matmul_tflops: {float16: 42.3, float32: 13.5}
  memory_gbps: 789
  h2d_gbps: 8.1
  d2h_gbps: 3.7
  h2d_pageable_gbps: 4.6
  # the Triton expert store's miss copy, a kernel reading page-locked host memory over the link — measured 2026-11-03 at
  # the first Triton launch on the rack's V100-SXM2-16GB (nbxtensor moe_device_residency.measure_miss_copy, the launch
  # grid's fastest): 1024 elements x 16 warps, 5.5 GB/s where the DMA copy moves 8.1
  expert_copy: {block: 1024, warps: 16, gbps: 5.5}
  # a decode step's matrix-vector product, GB/s of weights streamed — measured 2026-10-27 23:4x CET on the rack, card 0, alone (core/prism/facts_probe.gemv_gbps: x[1,4096] @ W[14336,4096]^T, 50 launches; W's bytes / time)
  gemv_gbps:
    triton: {float16: 763.2, float32: 822.4}
    compiled: {float16: 694.8, float32: 846.0}
  # the engines' loaders, GB/s landed — measured 2026-10-27 21:57-21:59 CET on the rack, card 0, alone (tools/profile_facts.py --weights, loader-rates-tool 4ee138b0 on the loader of 93b01e1c): Qwen3-30B-A3B:model BF16, Wan2.2-I2V-A14B:transformer F32, Sana_1600M:transformer F16, 3 GB each, cold = pages evicted (posix_fadvise DONTNEED)
  weight_load_gbps:
    triton:
      BF16: {device: {cold: 0.95, warm: 1.39}, host: {cold: 0.42, warm: 0.53}}
      F32: {device: {cold: 0.87, warm: 0.93}, host: {cold: 0.57, warm: 0.71}}
      F16: {device: {cold: 1.14, warm: 1.81}, host: {cold: 0.73, warm: 0.99}}
    compiled:
      BF16: {device: {cold: 0.92, warm: 1.6}, host: {cold: 0.6, warm: 1.56}}
      F32: {device: {cold: 1.3, warm: 1.53}, host: {cold: 0.68, warm: 2.46}}
      F16: {device: {cold: 2.56, warm: 3.28}, host: {cold: 0.7, warm: 5.77}}
