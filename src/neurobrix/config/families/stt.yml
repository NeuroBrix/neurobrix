# Family-level constants for STT (Speech-to-Text) models
# Pattern: audio waveform input + text transcription output
# References: Whisper, Canary-Qwen, Parakeet (RNN-T), Granite-Speech

output_processing:
  layout: "sequence"
  batch_axis: 0
  sequence_axis: 1
  vocab_axis: -1
  output_format: "txt"

defaults:
  temperature: 0.0  # Greedy decoding default for STT
  max_tokens: 448   # Whisper standard max generation length

audio_extent:
  # The recording lengths an any-length encoder of this family is PLANNED and CENSUSED over: the
  # derived census enumerates the encoder's frame extent from the shortest clip to the longest
  # feed (tools/derived_census.py), and a served plan prices the longest (serving/engine.py).
  # A fixed-window encoder (Whisper: its extractor pads every clip to its own 30 s) is one point.
  #
  # min_seconds — source: the vendor's own floor on a training utterance, NeMo
  # examples/asr/conf/fastconformer/fast-conformer_transducer_bpe.yaml and
  # conf/conformer/tdt/conformer_tdt_bpe.yaml, `train_ds.min_duration: 0.1` (read 2026-10-04).
  min_seconds: 0.1
  # The top needs no second value for the RNNT flow: it never feeds more than one window,
  # `long_form.rnnt_window_seconds` below.

long_form:
  # Audio longer than one window. The whisper class runs the vendor's
  # timestamp-seek algorithm over its own 30 s window (the extractor's
  # `chunk_length`; no policy: the model's own timestamps decide). The
  # RNNT class runs buffered inference — the NeMo long-form recipe
  # (examples/asr/asr_chunked_inference/rnnt/
  # speech_to_text_buffered_infer_rnnt.py): consecutive windows of
  # `rnnt_window_seconds` overlap by `rnnt_overlap_seconds` and tokens
  # are merged by the encoder frame they were emitted at. A recording
  # that fits one window, and the last window of a longer one, reach
  # the encoder at their own length — never padded.
  #
  # rnnt_window_seconds — source: the window the long-form gate was
  # proven at (commit 2f57c914, 2026-09-02, its VERDICT under
  # validation_outputs/maintenance_lot_2026_09_01/: parakeet-tdt-1.1b,
  # 600 s -> 22 windows, word ratio 0.990 against NeMo). Until
  # 2026-10-04 it was not a value: the flow read it off the encoder's
  # TRACE extent (3 000 mel frames at a 10 ms hop).
  rnnt_window_seconds: 30.0
  rnnt_overlap_seconds: 2.0

execution:
  # flow_type varies per model (encoder_decoder Whisper, rnnt Parakeet).
  # Read from topology.json.
  has_kv_cache: false  # encoder-decoder uses cross-attention, not LLM KV cache
  use_graph_executor: true
  compiled_mode: true

inputs:
  required: ["--audio"]
  optional:
    - flag: "--prompt"  # rare: transcription context hint

modes:
  supported: ["text"]
  default: "text"
  multimodal_strict: false

output:
  default_extension_per_mode:
    text: ".txt"
