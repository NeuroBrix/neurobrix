# Family-level constants for Audio-LLM models
# Pattern: audio input + text prompt → text output
# References: Voxtral (Mistral), Qwen2-Audio, Qwen3-Omni audio mode

output_processing:
  layout: "sequence"
  batch_axis: 0
  sequence_axis: 1
  vocab_axis: -1
  output_format: "txt"

defaults:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.0

architecture:
  rope:
    base: 10000.0
    scaling_type: null
    scaling_factor: 1.0
  attention:
    type: "sdpa"
    head_dim: 128
    num_kv_heads: null

kv_cache:
  enabled: true
  strategy: "dynamic"
  injection_op: "aten::scaled_dot_product_attention"

execution:
  flow_type: "audio_llm"
  has_kv_cache: true
  use_graph_executor: true
  compiled_mode: true

inputs:
  required: ["--audio", "--prompt"]
  optional:
    - flag: "--system"
    - flag: "--chat"
    - flag: "--no-chat"

modes:
  supported: ["text", "chat"]
  default: "text"
  multimodal_strict: false

output:
  default_extension_per_mode:
    text: ".txt"
    chat: ".txt"

audio_extent:
  # The recording lengths an any-length audio encoder of this family is PLANNED and CENSUSED over
  # (see stt.yml `audio_extent`). The whisper-encoder models of the family (Voxtral) are one point:
  # their extractor pads every clip to its own 30 s window.
  #
  # min_seconds — source: the vendor's floor on a training utterance, NeMo
  # examples/asr/conf/fastconformer/fast-conformer_transducer_bpe.yaml `train_ds.min_duration: 0.1`
  # (read 2026-10-04; canary-qwen's perception is that encoder class).
  min_seconds: 0.1
  # max_seconds — source: nvidia/canary-qwen-2.5b model card, "Input length. The maximum audio
  # duration in training was 40s [...] The model may technically be able to process longer
  # sequences, but its accuracy may be degraded" (read 2026-10-04). It is the only duration bound a
  # vendor of this family states: ibm-granite/granite-speech-3.3-8b's card states none.
  max_seconds: 40.0

# Confirmation request (tools/regression_matrix.py)
confirmation:
  # The smallest request that still judges an audio-understanding model (the owner's method, 2026-09-28).
  max_tokens: 32
