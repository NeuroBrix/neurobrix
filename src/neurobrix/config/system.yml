# NeuroBrix System Configuration
# ZERO HARDCODE: All constants are embedded variables

# Working paths. THE ONLY SOURCE for where model data lives on this machine.
#
# A snapshot is DOWNLOADED ONCE, to `snapshots`, and everything reads it THERE:
# the build toolchain traces from it and vendor tools (benchmarks, oracles) load
# from it. Nothing re-downloads and nothing copies. The Hugging Face hub cache
# must stay empty — a second copy of a 3 G vendor model on a 437 G local disk is
# how the root filesystem reached 0 MB on 2026-09-17.
#
# Relative to the user's home (`~`), so the shipped value names no machine; `NEUROBRIX_HF_SNAPSHOTS` overrides it.
paths:
  snapshots: ~/hf_snapshots

# Memory unit conversions
memory:
  bytes_per_kb: 1024
  bytes_per_mb: 1048576   # 1024 * 1024
  bytes_per_gb: 1073741824  # 1024 * 1024 * 1024

# Prism solver defaults
prism:
  default_seq_len: 4096

  # Fine-Grained Pipeline (FGP) settings
  fgp:
    utilization_target: 0.85  # Use 85% of GPU memory for FGP
    max_blocks_per_stage: 7   # Max transformer blocks per GPU (7 for 32GB, ~4 for 16GB)

  # Default values for model analysis (used when not specified in profile)
  defaults:
    batch_size: 2   # CFG batching (positive + negative prompts)
    patch_size: 2   # Standard DiT/Sana patch size

# Dtype widths: config/dtypes.yml (one table, read by core/dtype/itemsize.py and triton/itemsize.py).

# Numerical Stability
precision: {}

# High-Performance I/O Configuration
# ENTERPRISE: Parallel loading + Pinned Memory DMA
io:
  # The loaders' parallel reads are a measured fact of the machine: the hardware profile's cpu.io_workers.

  # glibc only: a host allocation at or above this size is its own mmap, given back to the OS when freed.
  # glibc's DYNAMIC threshold rises to the largest block freed (up to 32 MiB), so a weight loader's
  # read-convert-upload temporaries then come from the heap and stay there: 6 deepseek-moe shards
  # (12.3 GB) streamed to a V100 left 22.7 GB of anonymous RSS at the end; pinned at 1 MiB, 1.07 GB
  # peak and 0.27 GB after, at 7.1 s against 7.2 s for the whole-shard loader (2026-10-10,
  # nbx/campaigns/2026_10_10_stageb_peak loadexp/stepexp; MALLOC_ARENA_MAX 1 or 2 changed nothing).
  host_mmap_threshold_bytes: 1048576

  # Linux only: may numpy back an array over 4 MiB with transparent huge pages (madvise MADV_HUGEPAGE,
  # numpy's default on kernels >= 4.6, https://numpy.org/doc/stable/reference/global_state.html)?
  # With the kernel's THP defrag at `madvise` (Ubuntu's default) each first touch of such an array may
  # compact memory synchronously; under a page cache full of weight shards it does not return: Qwen3-VL-30B's
  # Triton load sat 30 min in `__alloc_pages_direct_compact` -> `compact_zone` (2 460 s of system time, RSS
  # frozen at 29 GB, 184 GB of page cache, compact_stall 4.9 M of which 85 % failed; V100 rack 2026-10-23
  # 03:00-03:40). Same pathology: https://github.com/bscott711/bioimaging/pull/13 (30 GB of arrays 101 s ->
  # 15 s opted out), https://github.com/golang/go/issues/61718.
  host_huge_pages: false

  # Non-blocking uploads one compiled-loader worker keeps outstanding before it waits for the oldest
  # (core/io/weight_loader.py `_load_with_pinned_dma`). A pinned block goes back to PyTorch's host cache
  # only once its copy is done, and that cache never gives memory back: unbounded, deepseek-moe
  # layer_streaming grew RssShmem 1.0 -> 3.7 GB over one run (2026-10-10). Two overlap the next read
  # with the previous copy; Prism prices the pinned bytes as workers x this x the largest tensor.
  pinned_uploads_in_flight: 2

  # Use pinned memory for PCIe DMA transfers
  # Enables 16GB/s transfer vs ~8GB/s CPU copy
  use_pinned_memory: true

  # Prefetch next component while current executes
  # Overlaps I/O with GPU compute
  enable_prefetch: true

  # Number of components to prefetch ahead
  prefetch_queue_size: 2

  # Log performance metrics
  log_performance: true

# The serving daemon's dispatcher (serving/server.py, serving/operations.py; Studio requests 3-4).
# PROVENANCE: chosen when the dispatcher became one thread per connection (2026-10-11), not
# measured — each value is data so a measurement has one place to land.
serving:
  # How long a `cancel` waits for its operation's decode loop to read the stop flag, return and
  # have its devices synced before it answers `cancel_pending` (never a confirmation). A stop is
  # read once per token, so this bounds ONE decode step plus the flow's own wind-down; chosen
  # far above a token step of a streamed plan (seconds), and below a client's patience.
  cancel_ack_timeout_s: 120
  # The KV host tier's cap in MB (core/state/kv_tier.py): null = the budget the profile gives (installed RAM less the
  # system's share less the plan's host side); a number caps it; 0 turns the tier off. The user's choice, never ours.
  kv_host_tier_mb: null
  # Finished operations the table remembers, so a late `cancel` gets `already_finished` /
  # `already_cancelled` instead of `unknown_op`. The oldest is forgotten first.
  operations_retained: 256
  # Pending connections the listening socket queues while the accept thread hands one to its
  # thread (socket.listen backlog). The accept loop never serves, so the queue drains at once.
  listen_backlog: 16
  # How often a connection whose client sent a NON-streamed work request is checked for a
  # vanished client while the generation runs (a streamed one learns it at its next send).
  orphan_poll_s: 0.5
  # How long a shutdown waits for the connection threads to deliver the replies of the work it
  # stopped before the process exits.
  drain_timeout_s: 30
  # How often a Windows launcher (`neurobrix serve` without --foreground) looks for the daemon's
  # ready file while the daemon loads. POSIX launchers block on a pipe and never poll; Windows
  # hands a child no inherited fd through subprocess, so the file remains there. A wait ends on
  # the file or on the child's exit, never on a deadline: a long load is not a failure.
  ready_poll_s: 0.5
  # The rows a served session's plan prices ONE prefill pass at when no certified time chose its chunk
  # (core/prism/prefill_chunk.py `served_untimed`), per GB of the decoder card's memory class: a turn that
  # brings up to that many new positions is one unpadded pass; a longer one is cut into passes of that many
  # rows (whole pages of the session's cache). Per GB because the rows cost memory, and what a card can give
  # is its own (the Mac's review, 2026-11-12): 64 rows a GB is 2 048 rows on a 32 GB card, 1 024 on 16 GB.
  # Measured 2026-11-12 on ONE class (Qwen3-Coder-30B-A3B, experts streamed, one V100-32GB, Triton): a pass
  # costs about the same whatever its rows (128 rows 8.5 s, 1 124 rows 10.2 s: each pass streams most of the
  # experts), so the PASSES are the cost — a 1 124-token first request took 51.6 s in 128-row passes against
  # 10.2 s in one; and the rows cost memory only (the experts' cache the plan leaves: 19.5 GB at 128 priced
  # rows, 19.2 at 1 024, 18.8 at 2 048, 17.9 at 4 096, 16.2 at 8 192). 2 048 holds an agent's first request
  # (system prompt and tools: 1.1-1.9K tokens measured) in one pass for 0.7 GB of that cache. Other classes
  # (16 GB, unified memory) take the same rows a GB until their own measurement says otherwise.
  session_prefill_rows_per_card_gb: 64
  # The OpenAI-compatible HTTP door (`neurobrix serve --http`), docs/serving.md. Read only when the door is
  # opened; each is then required (a missing value is refused by name).
  # Where it listens by default: the loopback interface only — a non-loopback address needs an API key.
  http_host: 127.0.0.1
  # Its default port. Not 5000 or 7000, which macOS's AirPlay receiver holds (Mac review, 2026-11-08, which
  # chose 8765). A port already taken is refused at start, naming the process that holds it.
  http_port: 8765
  # HTTP work requests allowed to WAIT for the model at once (every door's queued operations counted); one more
  # is answered 429 `server_busy`. A queued request holds its body (an image, an audio file) in the host memory
  # Prism planned against, so the queue is bounded; 8 waiting requests of the 64 MiB body bound below stay
  # within half a GiB.
  http_max_queued: 8
  # The largest request body accepted, in MiB (an uploaded audio file or a base64 image). The socket door's
  # frame bound is the same 64 MiB (serving/protocol.py MAX_MESSAGE_SIZE).
  http_max_body_mb: 64
