# Benchmark rows — BLOC E v3 (2026-08-08 supervisor directives).
#
# REFERENCE rows (reference: true) are the public optimization curve:
# milestone reports and every published number measure HERE, on big
# known models — the most publicly used per family, NEVER hub-coverage
# sweeps. PROBE rows (probe: true) are internal fast iteration probes
# (non-regression, pass development) — never a public number.
#
# v3 revisions (supervisor, 2026-08-08):
#   - llm_heavy_qwen3_coder REPLACED and llm_moe_deepseek DROPPED.
#     Four 2026 multimodal reference rows take their place:
#     Qwen3-VL-30B, Qwen3-Omni-30B, GLM-4.1V-9B, Ming-Lite-Omni-1.5.
#   - DUAL-CONFIG publication (serving_configs) for every row whose
#     model exceeds one 32 GB V100: "pinned" = single visible GPU +
#     matching single-GPU hardware profile (battery closure-config
#     pattern); "machine" = the full rig visible (4x V100, 96 GB),
#     NO CUDA pin, NO --hardware (autodetect) — Prism places freely,
#     and competitors also get the whole machine with their best
#     weapons. Rows <= 32 GB stay single-config (machine == pinned).
#   - DNR capability matrix: a competitor cell that cannot run on the
#     V100 rig is a first-class recorded verdict (status "dnr" +
#     evidenced cause: arch missing at pin, flash-attn sm_80+ hard
#     requirement, bf16-only stack, no runtime serves the family).
#     The public table renders DNR prominently — the capability axis
#     ("they cannot run model X on V100; we do") leads, speed follows.
#
# Every column of a row serves the SAME upstream checkpoint in fp16,
# warm serving (cold start recorded separately), pinned config down to
# the seed, N repetitions, dated committed baseline.
#
# Diffusion-family metric is seconds/image (or /video) and
# seconds/step at identical config — never tok/s. STT metric is wall +
# RTF vs the pinned 11.00 s input. Omni metric is wall prompt→wav
# (voice) or wall prompt→png (image-out).
#
# Column vocabulary:
#   vllm / ollama            third-party runtimes (pins: backends.yml)
#   diffusers                HF diffusers competitor (image/video rows)
#   vendor_transformers      the model's official HF code, pinned —
#                            the competitor when no third-party
#                            runtime serves the family (supervisor
#                            rule: no third party ⇒ measure vs vendor)
#   neurobrix_pytorch / neurobrix_triton   our two engines

defaults:
  repetitions: 5
  warmup_requests: 1
  decoding: greedy
  stream: true
  gpu_memory_sample_hz: 1

rows:
  # ================= REFERENCE ROWS (the curve) =================

  - id: stt_whisper_turbo
    family: stt
    metric_class: stt
    reference: true
    checkpoint: openai/whisper-large-v3-turbo
    neurobrix_model: whisper-large-v3-turbo
    audio: benchmarks/assets/jfk_11s.wav
    audio_duration_s: 11.00   # RTF denominator — cells read THIS field
    # jfk_11s.wav: whisper.cpp canonical sample (public domain), mono
    # 16 kHz, 11.00 s, sha256 59dfb9a4acb36fe2a2affc14bacbee2920ff435c
    # b13cc314a08c13f66ba7860e
    columns: [vendor_transformers, neurobrix_pytorch, neurobrix_triton]

  - id: vlm_qwen3vl
    family: vlm
    metric_class: tokens
    reference: true
    checkpoint: Qwen/Qwen3-VL-30B-A3B-Thinking
    neurobrix_model: Qwen3-VL-30B-A3B-Thinking
    # Ollama column rides the LIBRARY route (their packaging = their
    # best weapon): qwen3-vl needs Ollama >= 0.12.7 (release notes),
    # our pin 0.24.0 qualifies; bf16 tag = their full-precision
    # variant (documented — llama.cpp converts bf16 on Volta at a
    # cost that is theirs to carry). The ollama-create-from-GGUF
    # import path is documented-broken for qwen3vlmoe with no fix by
    # the pin (ollama#12896, #13480, #16264) — recorded, not used.
    ollama_pull: qwen3-vl:30b-a3b-thinking-bf16
    prompt: "What fruit is shown in this image? Answer briefly."
    input_image: benchmarks/assets/apple_448.png
    # apple_448.png: 448x448 RGB, sha256 34210187f5db3ed5d02b02f81ac3
    # 6319ad912d3d57de3b0a03537a06442427a8 (promoted from the Qwen3-VL
    # validation asset — committed so every column reads ONE input).
    max_new_tokens: 64
    serving_configs: [pinned, machine]   # 58 GB fp16 > one 32 GB V100
    # ollama column: qwen3-vl support at the v0.24.0 era pin to be
    # verified (GGUF + mmproj acquisition) — if the pin cannot serve
    # it on V100, the cell records a DNR verdict with evidence.
    dnr_columns:
      vllm: "vllm==0.7.3 (era pin, 2025-02) predates the qwen3_vl
        architecture entirely — no model class exists at this pin
        (qwen3 family support landed in vLLM 0.8.x)."
    columns: [ollama, vendor_transformers,
              neurobrix_pytorch, neurobrix_triton]

  - id: omni_qwen3omni
    family: multimodal
    metric_class: omni
    reference: true
    checkpoint: Qwen/Qwen3-Omni-30B-A3B-Instruct
    neurobrix_model: Qwen3-Omni-30B-A3B-Instruct
    prompt: "In one short sentence, what did the speaker say?"
    audio: benchmarks/assets/jfk_11s.wav
    mode: audio
    max_new_tokens: 32
    env:
      # 66 GB het-pack: torch caching-allocator fragmentation left
      # 2.47 GiB reserved-but-unallocated on the 16G card while a
      # 20 MiB alloc failed (2026-08-11 retry log). Same remedy the
      # dsv2 battery rows pin; recorded closure config.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    # Audio-in -> speech-out = this model's VALIDATED closure class
    # (the deepstack vlm branch requires a modality input; text-only
    # prompt->speech on that class is a NAMED engine gap — the
    # staged-splice class has an inert-stub text form, deepstack does
    # not yet). The AR-diversion guard (2026-08-08) makes the gap
    # LOUD instead of a silent tokens-only answer.
    serving_configs: [pinned, machine]   # 66 GB fp16 > one 32 GB V100
    # THE headline capability row (R16 verdict 2026-08-08): no
    # third-party runtime serves omni speech-out AND the vendor's own
    # official stack cannot run this model on the V100 rig — NeuroBrix
    # is the only engine that serves Qwen3-Omni speech on this
    # hardware (4-mode validated, hub fresh).
    dnr_columns:
      vendor_transformers: "The vendor's official recipe cannot run on
        this rig: documented theoretical minimum 78.85 GB measured
        WITH flash_attention_2 (Qwen3-Omni memory-table footnote);
        FlashAttention-2 does not exist on sm_70 (Dao-AILab
        flash-attention#524/#148/#228 — Ampere+ only), and the
        sdpa/eager fallback costs MORE than that minimum on the 96 GB
        heterogeneous pool; vendor-validated dtype is bf16, emulated
        (not native) on Volta (pytorch#124996). Weights alone: 70.5 GB
        across 15 shards."
    columns: [neurobrix_pytorch, neurobrix_triton]

  - id: vlm_glm41v
    family: vlm
    metric_class: tokens
    reference: true
    checkpoint: zai-org/GLM-4.1V-9B-Thinking
    neurobrix_model: GLM-4.1V-9B-Thinking
    prompt: "What fruit is shown in this image? Answer briefly."
    input_image: benchmarks/assets/apple_448.png
    max_new_tokens: 64
    # 20 GB fp16 — fits resident on one V100-32G: single config.
    # vendor_transformers is the third-party competitor; the two
    # runtime columns below are sourced DNR (R16 verdict 2026-08-08).
    dnr_columns:
      vllm: "vllm==0.7.3 (era pin, 2025-02) predates GLM-4.1V
        (released 2025-07) — no glm4v model class exists at this pin."
      ollama: "Ollama has NO glm4v support at the v0.24.0 pin (or
        any version): model request ollama#11858 closed as duplicate
        with no development; no published GGUF carries the vision
        mmproj (unsloth GLM-4.1V-9B-Thinking-GGUF discussion#1:
        'currently only text is supported'); upstream llama.cpp only
        gained GLM4V vision on 2025-12-16 (PR #18042) and Ollama's
        vendored llama.cpp does not expose it."
    columns: [vendor_transformers,
              neurobrix_pytorch, neurobrix_triton]

  - id: omni_ming_t2i
    family: multimodal
    metric_class: image
    reference: true
    checkpoint: inclusionAI/Ming-Lite-Omni-1.5
    neurobrix_model: Ming-Lite-Omni-1.5
    prompt: "a red apple on a white table"
    mode: image
    steps: 30
    seed: 42
    # 384x384 / 30 FlowMatchEuler steps / CFG 5.0 / seed 42 = the
    # closure-config geometry from the 4/4 matrix verdict
    # (validation_outputs/ming_imagegen_smoke_2026_08_01) — geometry
    # and CFG come from package data (topology.flow.image_gen +
    # defaults), so the row does NOT pass height/width.
    serving_configs: [pinned, machine]   # 50 GB fp16 > one 32 GB V100
    env:
      # Step-cache drift verdict (Hocine 2026-08-15, delegated eye on
      # the campaign PNGs): thr=0.15 = ROW DEFAULT (36.48 dB,
      # indistinguishable vs the exact replay reference). 0.25 = NO as
      # default (visible skin-texture smoothing) — opt-up per case only.
      NBX_STEP_CACHE_THRESHOLD: "0.15"
      NBX_STEP_CACHE_MAX_SKIPS: "3"
    # Capability row (R16 verdict 2026-08-08): no third-party runtime
    # serves Ming, and the vendor's own stack cannot run it on V100 —
    # NeuroBrix renders Ming t2i on this hardware (4/4 matrix,
    # validation_outputs/ming_imagegen_smoke_2026_08_01).
    dnr_columns:
      vendor_transformers: "The vendor's official recipe cannot run on
        V100: their single-device loading path needs ~42 GB bf16
        (model card) > 32 GB, with NO published multi-GPU HF recipe;
        official snippets hard-pass attn_implementation=
        'flash_attention_2' installed from an sm_80+ cu12/torch2.4
        wheel — impossible on sm_70 (Dao-AILab #524); vendor
        validation hardware is H800-80GB/H20-96G, bf16-only
        (inclusionAI/Ming v1.5 requirements + model card)."
    columns: [neurobrix_pytorch, neurobrix_triton]

  - id: image_diffusion_sana1024
    family: image
    metric_class: image
    reference: true
    env:
      # F1 drift verdict (Hocine 2026-08-15): thr=0.15 = ROW DEFAULT
      # (0.25 = opt-up per row only, never a default without
      # re-inspection). validation_outputs/f1_step_cache_2026_08_13/.
      NBX_STEP_CACHE_THRESHOLD: "0.15"
      NBX_STEP_CACHE_MAX_SKIPS: "3"
    checkpoint: Efficient-Large-Model/Sana_1600M_1024px_MultiLing
    diffusers_checkpoint: Efficient-Large-Model/Sana_1600M_1024px_MultiLing_diffusers
    # 2026-08-26: local artifact renamed to the hub slug — the legacy
    # Sana_1600M_1024px_MultiLing cache copy was PROVEN byte-identical
    # and removed (validation_outputs/hub_benchmark_2026_08/
    # SANA_DUPLICATE_PROOF.md). Same artifact, same row identity.
    neurobrix_model: Sana-1600M-MultiLing
    prompt: "a red apple on a wooden table"
    steps: 20
    seed: 42
    height: 1024
    width: 1024
    columns: [diffusers, neurobrix_pytorch, neurobrix_triton]

  - id: image_diffusion_pixart_xl
    family: image
    metric_class: image
    reference: true
    env:
      NBX_STEP_CACHE_THRESHOLD: "0.15"
      NBX_STEP_CACHE_MAX_SKIPS: "3"
    checkpoint: PixArt/PixArt-XL-1024
    diffusers_checkpoint: /home/mlops/hf_snapshots/PixArt-XL-2-1024-MS
    neurobrix_model: PixArt-XL-1024
    prompt: "a red apple on a wooden table"
    steps: 20
    seed: 42
    height: 1024
    width: 1024
    columns: [diffusers, neurobrix_pytorch, neurobrix_triton]

  - id: image_diffusion_pixart_sigma
    family: image
    metric_class: image
    reference: true
    env:
      NBX_STEP_CACHE_THRESHOLD: "0.15"
      NBX_STEP_CACHE_MAX_SKIPS: "3"
    checkpoint: PixArt/PixArt-Sigma-XL-1024
    diffusers_checkpoint: /home/mlops/hf_snapshots/PixArt-Sigma-XL-2-1024-MS
    neurobrix_model: PixArt-Sigma-XL-1024
    prompt: "a red apple on a wooden table"
    steps: 20
    seed: 42
    height: 1024
    width: 1024
    columns: [diffusers, neurobrix_pytorch, neurobrix_triton]

  - id: video_wan13b_t2v
    family: video
    metric_class: video
    reference: true
    checkpoint: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    diffusers_checkpoint: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    neurobrix_model: Wan2.1-T2V-1.3B-Diffusers
    prompt: "a red fox running through snow"
    steps: 10
    num_frames: 13
    seed: 0
    height: 480
    width: 832
    diffusers_recipe:
      vae_fp32: true   # Wan doctrine (sm_70, sourced) — reproduces the banked cell byte-for-byte
    # 480x832 = the Wan pipeline's native default, pinned EXPLICITLY
    # so both columns run the identical resolution.
    # 13 frames / 10 steps = the battery closure config proven to fit
    # one V100-32G on both engines; s/step + s/frame normalize.
    # Step-cache VIDEO verdict (Hocine 2026-08-15, frames eyeballed):
    # 0.15 NO and 0.25 NO categorical — the subject washes out at 0.15
    # and dissolves at 0.25 mid-sequence; temporal accumulation makes
    # IMAGE thresholds non-transferable to VIDEO. This row stays
    # REPLAY-ONLY (no NBX_STEP_CACHE_* pin, ever, without a fresh R29
    # verdict on MOVING images); a low-frequency 0.05-0.08 arm may be
    # measured later as an opt-in experiment.
    columns: [diffusers, neurobrix_pytorch, neurobrix_triton]

  - id: omni_minicpmo_voice
    family: multimodal
    metric_class: omni
    reference: true
    checkpoint: openbmb/MiniCPM-o-4_5
    neurobrix_model: MiniCPM-o-4_5
    prompt: "Reply with exactly these two words: Hello there."
    mode: audio
    max_new_tokens: 32
    env:
      NBX_FORCE_RAND_SEED: "1234"   # battery closure pin (voice draw)
    # No third-party runtime serves omni voice-out — the competitor is
    # the vendor's own HF code on the same machine (supervisor rule).
    columns: [vendor_transformers, neurobrix_pytorch, neurobrix_triton]

  # ================= PROBE ROWS (internal iteration only) =================

  - id: llm_moe_qwen3coder_int4
    family: llm
    metric_class: tokens
    reference: true
    checkpoint: Qwen/Qwen3-Coder-30B-A3B-Instruct
    neurobrix_model: Qwen3-Coder-30B-A3B-Instruct-int4g128-ffnonly
    # Quantized-tier PROOF ROW (E7): the 30B-A3B class on ONE
    # V100-32G via the int4-g128 weight-encoding variant. CANONICAL
    # ARTIFACT = ffn-only (experts int4, attention projections fp16):
    # the full attn+ffn variant measured +9.26% relative ppl (below
    # the sourced RTN class) while ffn-only measures +3.53% — in the
    # published band; the Qwen3 attention fragility is measured, not
    # assumed. Fairness =
    # SAME quantization class: the ollama column runs their Q4_K_M
    # (qwen3-coder:30b default pull), never their fp16. The fp16
    # NeuroBrix column stays documented from its own multi-GPU
    # measurements (57G does not fit one card — the row note IS the
    # capability headline). Kernel ceiling compass: ~147 tok/s
    # (2 GB activated int4 / 294 GB/s effective GEMV bandwidth).
    ollama_pull: qwen3-coder:30b
    prompt: "Write a Python function that reverses a string."
    max_new_tokens: 128
    env:
      # P-REPLAY-KV-DECODE closure config (2026-08-17): frozen-plan
      # replay on the decode graph. NOT a drift class — every bucket is
      # verify-first byte-gated against the normal path in-process, and
      # the cross-run byte gate (32-tok and 250-tok incl. a bucket
      # boundary) matched the replay-off output exactly (ce0c22a3 /
      # 250-tok pair in validation_outputs/replay_kv_decode_2026_08_17).
      NBX_TRITON_REPLAY: "1"
      NBX_REPLAY_KV_DECODE: "1"
      # Phase 4b adoption (2026-08-17): per-bucket CUDA-graph launch of
      # the frozen plan. A/B measured on this row: 4.86 -> 5.78 tok/s
      # (+18.8%), answers byte-identical (sha 0456f422 x5 both arms).
      NBX_REPLAY_GRAPH: "1"
    columns: [ollama, neurobrix_triton]

  - id: llm_dense_tinyllama
    family: llm
    metric_class: tokens
    probe: true   # fast iteration probe — NEVER a public number
    checkpoint: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    neurobrix_model: TinyLlama-1.1B-Chat-v1.0
    gguf: tinyllama-1.1b-chat-v1.0.f16.gguf
    prompt: "Explain in three sentences why the sky is blue."
    max_new_tokens: 128
    columns: [vllm, ollama, neurobrix_pytorch, neurobrix_triton]

  # ---- S3 upscaler segment (hub benchmark 2026-08; prereg:
  # validation_outputs/hub_benchmark_2026_08/S3_IMAGE_PREREG.md).
  # Competitor = the vendor/reference stack in its pinned venv
  # (upscaler_cell.py; venv name per row — basicsr version conflicts
  # force separate venvs, see the R16 synthesis). Same pinned input
  # for every arm; metric = seconds/image at the row's scale.
  # ── S4 VIDEO rows (prereg 2026-08-30; short pinned configs — the
  # wan13b precedent; I2V rows carry the versioned conditioning image;
  # n=3 declared in the prereg, dispersion gate 3%) ─────────────────
  - id: video_cog2b_t2v
    family: video
    metric_class: video
    reference: true
    checkpoint: THUDM/CogVideoX-2b
    diffusers_checkpoint: THUDM/CogVideoX-2b
    neurobrix_model: CogVideoX-2b
    prompt: "a red fox running through snow"
    steps: 10
    num_frames: 9
    seed: 0
    height: 480
    width: 720
    columns: [diffusers, neurobrix_pytorch, neurobrix_triton]

  - id: video_cog5b_i2v
    family: video
    metric_class: video
    reference: true
    checkpoint: THUDM/CogVideoX-5b-I2V
    diffusers_checkpoint: THUDM/CogVideoX-5b-I2V
    neurobrix_model: CogVideoX-5b-I2V
    prompt: "a red fox running through snow"
    steps: 10
    num_frames: 9
    seed: 0
    height: 480
    width: 720
    input_image: benchmarks/assets/apple_448.png
    diffusers_recipe:
      cpu_offload: true  # CogVideoX-5b card recipe below ~32 GB; resident fp16 OOMs at VAE-decode group_norm (2026-09-01 cell, peak 32101 MiB)
      vae_tiling: true
    columns: [diffusers, neurobrix_pytorch, neurobrix_triton]

  - id: video_wan_vace
    family: video
    metric_class: video
    reference: true
    checkpoint: Wan-AI/Wan2.1-VACE-1.3B-diffusers
    diffusers_checkpoint: Wan-AI/Wan2.1-VACE-1.3B-diffusers
    neurobrix_model: Wan2.1-VACE-1.3B-diffusers
    prompt: "a red fox running through snow"
    steps: 10
    num_frames: 13
    seed: 0
    height: 480
    width: 832
    input_image: benchmarks/assets/apple_448.png
    # The nbx VACE build is traced WITH image conditioning
    # (global.image is a required graph input — 08-30 FAILS-CONFIG);
    # the diffusers arm must run the SAME task, which for WanVACE is
    # reference_images (its pipeline has no `image` kwarg; prompt-only
    # is a different task — the 08-30 27.9 s prompt-only vendor cell
    # is superseded by this row's re-run).
    diffusers_recipe:
      vae_fp32: true   # Wan doctrine
      image_kwarg: reference_images
      image_as_list: true
    columns: [diffusers, neurobrix_pytorch, neurobrix_triton]

  - id: video_wan14b_i2v
    family: video
    metric_class: video
    reference: true
    checkpoint: Wan-AI/Wan2.1-I2V-14B-480P-Diffusers
    diffusers_checkpoint: Wan-AI/Wan2.1-I2V-14B-480P-Diffusers
    neurobrix_model: Wan2.1-I2V-14B-480P-Diffusers
    prompt: "a red fox running through snow"
    steps: 6
    num_frames: 9
    seed: 0
    height: 480
    width: 832
    input_image: benchmarks/assets/apple_448.png
    diffusers_recipe:
      # Full Wan-I2V vendor recipe. The float!=Half failure was in the
      # CLIP image encoder (visual_projection), NOT the VAE — the
      # first-cell hypothesis blaming vae_fp32 was wrong (full
      # traceback 2026-09-01 21:06 named the site). The pipeline casts
      # image_embeds and condition latents to the transformer dtype,
      # so both fp32 islands stay contained.
      vae_fp32: true
      image_encoder_fp32: true
      sequential_offload: true  # model-level offload still OOMs: the 27 GB transformer ALONE + activations exceeds the card (2026-09-01) — layer-level is the vendor weapon at this size

    # nbx arms run the MACHINE config: the 31 GB model is the proven
    # sharded case (cuda:2+3, commit 1d00037) — a pinned single-GPU
    # row was the 08-30 FAILS-CONFIG hole, not an engine gap.
    serving_configs: [pinned, machine]
    columns: [diffusers, neurobrix_pytorch, neurobrix_triton]

  - id: video_wan22_a14b_i2v
    family: video
    metric_class: video
    reference: true
    checkpoint: Wan-AI/Wan2.2-I2V-A14B-Diffusers
    diffusers_checkpoint: Wan-AI/Wan2.2-I2V-A14B-Diffusers
    neurobrix_model: Wan2.2-I2V-A14B-Diffusers
    prompt: "a red fox running through snow"
    steps: 6
    num_frames: 9
    seed: 0
    height: 480
    width: 832
    input_image: benchmarks/assets/apple_448.png
    diffusers_recipe:
      # All-fp16 MEASURED OK on this pipeline (2026-09-01 cell, R29
      # frame coherent): Wan2.2 A14B conditions without a CLIP image
      # encoder, so the wan14b dtype edge does not exist here.
      cpu_offload: true  # two A14B transformers (high/low noise) — far beyond one-card residency
    # nbx arms need the machine config (57 GB MoE placement = the D7
    # Prism-selection dependency; a FAIL here is the D7 record, not a cell).
    serving_configs: [pinned, machine]
    columns: [diffusers, neurobrix_pytorch, neurobrix_triton]

  - id: video_allegro_t2v
    family: video
    metric_class: video
    reference: true
    checkpoint: rhymes-ai/Allegro
    diffusers_checkpoint: rhymes-ai/Allegro
    neurobrix_model: Allegro
    prompt: "a red fox running through snow"
    steps: 6
    num_frames: 9
    seed: 0
    height: 368
    width: 640
    diffusers_recipe:
      vae_fp32: true    # Allegro card: the VAE runs in fp32
      vae_tiling: true  # Allegro VAE: decode without tiling raises NotImplementedError (08-30 cell proof)
    columns: [diffusers, neurobrix_pytorch, neurobrix_triton]

  - id: video_allegro_ti2v
    family: video
    metric_class: video
    reference: true
    checkpoint: rhymes-ai/Allegro-TI2V
    diffusers_checkpoint: rhymes-ai/Allegro-TI2V
    neurobrix_model: Allegro-TI2V
    prompt: "a red fox running through snow"
    steps: 6
    num_frames: 9
    seed: 0
    height: 368
    width: 640
    input_image: benchmarks/assets/apple_448.png
    diffusers_recipe:
      vae_fp32: true
      vae_tiling: true  # same Allegro VAE contract as the t2v row
    dnr_columns:
      diffusers: >-
        Allegro-TI2V is vendor-only: its model_index.json declares the
