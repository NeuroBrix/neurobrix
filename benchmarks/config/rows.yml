  - id: video_sana_video
    family: video
    metric_class: video
    reference: true
    checkpoint: Efficient-Large-Model/SANA-Video_2B_720p_diffusers
    diffusers_checkpoint: Efficient-Large-Model/SANA-Video_2B_720p_diffusers
    neurobrix_model: SANA-Video_2B_720p_diffusers
    prompt: "a red fox running through snow"
    steps: 8
    num_frames: 9
    seed: 0
    height: 480
    width: 832
    # SanaVideoPipeline ships in diffusers >= 0.36.0 (R16 sourced
    # 2026-09-01), but THIS 720p checkpoint needs 0.38.0: its
    # model_index references AutoencoderKLLTX2Video (first shipped
    # v0.37.0), and only v0.38.0's SanaVideoPipeline branches on the
    # LTX2-VAE config keys (temporal_compression_ratio) — 0.36 and
    # 0.37 cells both failed at load (2026-09-01 campaign log).
    # torch 2.5.1 stays in-range.
    # Upstream mandates bf16 transformer + fp32 VAE (fp16 tests
    # skipped for numerical instability) — bf16 is functional but
    # UNACCELERATED on sm_70, so this competitor number carries that
    # framing note in its annex row.
    diffusers_venv: diffusers_video
    diffusers_recipe:
      torch_dtype: bfloat16
      vae_fp32: true
      frames_kwarg: frames   # SanaVideoPipeline arg name (2026-09-01 cell)
    dnr_columns:
      diffusers: >-
        DNR-VERSION-CASCADE (five dated cells, 2026-09-01, logs in the
        campaign dir): the vendor stack does not run this checkpoint at
        the row's pinned config on any tested stable release —
        diffusers 0.35.2 lacks SanaVideoPipeline; 0.36.0 lacks the
        checkpoint's AutoencoderKLLTX2Video; 0.37.0's pipeline reads
        scale_factor_temporal keys the LTX2-VAE config does not carry;
        0.38.0 loads and generates but its video post-processor
        reshape fails at 480x832x9f (the 720p checkpoint's decode
        emits a mismatched spatial shape at this size). A vendor
        timing cell, if ever needed, is a dedicated chantier at the
        model's native 720p config. The nbx triton cell renders this
        exact row config in 39.5 s.
    columns: [diffusers, neurobrix_pytorch, neurobrix_triton]

