[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nbxtensor"
version = "0.0.8"
description = "Run AI models without PyTorch: tensors, Triton kernels, planned memory and certified tuning, wherever Triton runs — NVIDIA, AMD, Intel and Apple GPUs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Hocine Benkelaya", email = "contact@neurobrix.es" }]
maintainers = [{ name = "Hocine Benkelaya", email = "contact@neurobrix.es" }]
# numpy, triton, pyyaml (the dtype table is a YAML file) and, on Linux, the CUDA runtime. torch is never a dependency, not even an optional one:
# nbxtensor never imports torch (R-NBXT 6). Exchange with any other tensor
# library goes through DLPack, which the OTHER library imports.
# On Linux the CUDA runtime library its CUDA backend opens (libcudart.so.12), which the NVIDIA driver does not ship: a clean
# machine with only the driver found no GPU runtime and the engine read the card as CPU-only (the stable's install test,
# 2026-11-05). On a machine without an NVIDIA card it is a library nothing opens.
# Triton on every platform PyPI publishes it for; macOS has none (the Metal Triton is built from source, with triton-ext's
# AppleGPU backend — the README's install), so a plain "triton" made the library uninstallable on a Mac (2026-11-06).
# On a Mac the Metal device is opened through pyobjc's Metal framework; Triton for Metal comes from `install-metal`.
dependencies = ["numpy", "triton; platform_system != 'Darwin'", "pyyaml", "nvidia-cuda-runtime-cu12; platform_system == 'Linux'",
                "pyobjc-framework-Metal; platform_system == 'Darwin'"]

[project.urls]
Homepage = "https://github.com/NeuroBrix/nbxtensor"
Source = "https://github.com/NeuroBrix/nbxtensor"
Issues = "https://github.com/NeuroBrix/nbxtensor/issues"
Changelog = "https://github.com/NeuroBrix/nbxtensor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/nbxtensor"]

# The code taken from other projects, with their licenses, ships inside the package (the sdist carries it at the root).
[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "nbxtensor/THIRD_PARTY_NOTICES.md"
