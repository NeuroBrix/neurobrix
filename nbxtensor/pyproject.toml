[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nbxtensor"
version = "0.0.1"
description = "An inference-first tensor library, torch-free: planned memory, Triton kernels that declare their cost, CUDA / Apple Metal / CPU backends."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "NeuroBrix" }]
# numpy, triton and pyyaml (the dtype table is a YAML file) only. torch is never a dependency, not even an optional one:
# nbxtensor never imports torch (R-NBXT 6). Exchange with any other tensor
# library goes through DLPack, which the OTHER library imports.
dependencies = ["numpy", "triton", "pyyaml"]

[project.urls]
Homepage = "https://neurobrix.es"
Repository = "https://github.com/NeuroBrix/nbxtensor"
Changelog = "https://github.com/NeuroBrix/nbxtensor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/nbxtensor"]

# The code taken from other projects, with their licenses, ships inside the package (the sdist carries it at the root).
[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "nbxtensor/THIRD_PARTY_NOTICES.md"
