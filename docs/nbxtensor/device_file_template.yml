# A device file for a new backend or a new chip: nbxtensor/backend/devices/<vendor>/<name>.yml
# (docs/nbxtensor/BACKENDS.md section 4). Every key below is one a library reader reads
# (docs/nbxtensor/device_keys.txt, the device-key census). Fill each with the value of THIS device and write
# its source in a comment above it: the vendor's specification (document and section), or a measurement on the
# device (the command, the date). A value borrowed from a neighbouring part is not a value. A key you cannot
# fill stays absent: the reader that needs it refuses by name, it is never guessed.
#
# A section the census lists without sub-keys is read whole by its reader (see the reader named in
# docs/nbxtensor/BACKENDS.md); copy its shape from an existing device file of the same family.

